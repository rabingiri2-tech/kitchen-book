  check("the message lists packs and signs off", /2 × 25 kg sack — Flour/.test(ord.text) && /Test Cook$/.test(ord.text), ord.text);
  const nd = nextDelivery(S.suppliers[0]);
  check("next delivery is a Tue or Fri at least 2 days out", !!nd && (nd.getDay() === 2 || nd.getDay() === 5) && nd - Date.now() >= 2*86400000 - 1000, String(nd));
  S.ingredients[0].defaultSupplierId = "s2";
  reindex();
  check("shopping honours an Always use pin", sourcingPlan([{ingredientId:"f", baseQty:1000}]).perItem[0].best.price.supplierId === "s2");
  delete S.ingredients[0].defaultSupplierId;

  out.push("");
  out.push("LINKS");
  check("web links pass", safeUrl("https://example.com/a") === "https://example.com/a");
  check("a bare domain gets https", safeUrl("metro.com") === "https://metro.com");
  check("javascript: links are refused", safeUrl("javascript:alert(1)") === null);

  out.push("");
  out.push("");
  out.push("IMPORTING FILES");
  const csvRows = parseDelimited('Recipe,Ingredient,Qty,Unit,Servings\n"Dal, yellow",Toor dal,200,g,4\n,Onion,1,each,\n,Ghee,2,tbsp,\nChai,Milk,500,ml,2\n');
  check("CSV keeps a quoted comma inside one cell", csvRows.length === 5 && csvRows[1][0] === "Dal, yellow", csvRows[1]);
  const fromCsv = tableRecipes(csvRows);
  check("a Recipe + Ingredient sheet gives two recipes, no AI", fromCsv && fromCsv.length === 2, fromCsv && fromCsv.map(r => r.name));
  check("blank recipe cells belong to the recipe above", fromCsv && fromCsv[0].lines.length === 3, fromCsv && fromCsv[0].lines.length);
  check("quantity and unit columns are read", fromCsv && fromCsv[0].lines[0].qty === 200 && fromCsv[0].lines[0].unit === "g" &&
    fromCsv[0].lines[2].unit === "tbsp", fromCsv && fromCsv[0].lines);
  check("servings column is read", fromCsv && fromCsv[0].servings === 4 && fromCsv[1].servings === 2);
  const loose = tableRecipes(parseDelimited("Ingredient,Qty\nFlour,500\n"));
  check("a sheet with no Recipe column is left to the AI", loose === null, loose);
  const tsv = parseDelimited("Recipe\tIngredient\nToast\t2 slices bread\n");
  check("tab-separated text works too", tsv[1][1] === "2 slices bread");
  const inline = tableRecipes(parseDelimited("Dish,Ingredients\nOmelette,3 eggs\nOmelette,10 g butter\n"));
  check("\"250 g butter\" written in one cell is split into amount and unit",
    inline && inline.length === 1 && inline[0].lines[1].qty === 10 && inline[0].lines[1].unit === "g", inline);

  /* build real .docx / .xlsx archives here, stored and deflated */
  async function makeZip(files, deflate){
    const enc = new TextEncoder(), parts = [], central = [];
    let offset = 0, count = 0;
    for(const name in files){
      const nameB = enc.encode(name);
      let data = enc.encode(files[name]);
      const usize = data.length;
      let method = 0;
      if(deflate){
        data = new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer());
        method = 8;
      }
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(8, method, true);
      lh.setUint32(18, data.length, true); lh.setUint32(22, usize, true); lh.setUint16(26, nameB.length, true);
      parts.push(new Uint8Array(lh.buffer), nameB, data);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(10, method, true);
      ch.setUint32(20, data.length, true); ch.setUint32(24, usize, true); ch.setUint16(28, nameB.length, true);
      ch.setUint32(42, offset, true);
      central.push(new Uint8Array(ch.buffer), nameB);
      offset += 30 + nameB.length + data.length;
      count++;
    }
    const cdSize = central.reduce((a, b) => a + b.length, 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, count, true); end.setUint16(10, count, true);
    end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
    return new Blob(parts.concat(central, [new Uint8Array(end.buffer)]));
  }
  const W = 'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"';
  const docXml = '<?xml version="1.0"?><w:document ' + W + '><w:body>' +
    '<w:p><w:r><w:t>Banana </w:t></w:r><w:r><w:t>pancakes</w:t></w:r></w:p>' +
    '<w:tbl><w:tr><w:tc><w:p><w:r><w:t>200 g</w:t></w:r></w:p></w:tc><w:tc><w:p><w:r><w:t>flour</w:t></w:r></w:p></w:tc></w:tr></w:tbl>' +
    '<w:p><w:r><w:t>Mix</w:t></w:r><w:r><w:tab/><w:t>well</w:t></w:r></w:p></w:body></w:document>';
  try {
    const docx = await makeZip({"[Content_Types].xml":"<Types/>", "word/document.xml":docXml}, true);
    const docText = await docxText(await readZip(await docx.arrayBuffer()));
    check("a Word file's paragraphs are read in order", /^Banana pancakes\n/.test(docText), docText);
    check("a Word table row reads as cells", docText.indexOf("200 g | flour") >= 0, docText);
    check("a tab inside a paragraph is kept", docText.indexOf("Mix\twell") >= 0, docText);
  } catch(e){ check("a Word file opens", false, String(e && (e.message || e.code))); }

  const X = 'xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"';
  const R = 'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"';
  const xlsxFiles = {
    "xl/workbook.xml": '<workbook ' + X + ' ' + R + '><sheets><sheet name="Menu" sheetId="1" r:id="rId1"/></sheets></workbook>',
    "xl/_rels/workbook.xml.rels": '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Target="worksheets/sheet1.xml" Type="x"/></Relationships>',
    "xl/sharedStrings.xml": '<sst ' + X + '><si><t>Recipe</t></si><si><t>Ingredient</t></si><si><t>Qty</t></si><si><t>Unit</t></si>' +
      '<si><t>Chicken curry</t></si><si><t>Chicken thigh</t></si><si><t>kg</t></si><si><r><t>On</t></r><r><t>ion</t></r></si><si><t>each</t></si></sst>',
    "xl/worksheets/sheet1.xml": '<worksheet ' + X + '><sheetData>' +
      '<row r="1"><c r="A1" t="s"><v>0</v></c><c r="B1" t="s"><v>1</v></c><c r="C1" t="s"><v>2</v></c><c r="D1" t="s"><v>3</v></c></row>' +
      '<row r="2"><c r="A2" t="s"><v>4</v></c><c r="B2" t="s"><v>5</v></c><c r="C2"><v>1.5</v></c><c r="D2" t="s"><v>6</v></c></row>' +
      '<row r="3"><c r="B3" t="s"><v>7</v></c><c r="C3"><v>2</v></c><c r="D3" t="s"><v>8</v></c></row>' +
      '</sheetData></worksheet>'
  };
  try {
    const xlsx = await makeZip(xlsxFiles, false);
    const sheets = await xlsxSheets(await readZip(await xlsx.arrayBuffer()));
    check("an Excel sheet is found by its name", sheets.length === 1 && sheets[0].name === "Menu", sheets.map(s => s.name));
    check("an empty first cell keeps the columns lined up", sheets[0].rows[2][0] === "" && sheets[0].rows[2][1] === "Onion", sheets[0].rows[2]);
    const g = await gatherImport([new File([await makeZip(xlsxFiles, true)], "menu.xlsx")]);
    check("an Excel recipe sheet imports with no AI", g.direct.length === 1 && g.direct[0].name === "Chicken curry" &&
      g.direct[0].lines.length === 2 && g.direct[0].lines[0].qty === 1.5 && g.direct[0].lines[0].unit === "kg" &&
      !g.text && !g.attach.length, g);
  } catch(e){ check("an Excel file opens", false, String(e && (e.message || e.code))); }

  const oldDoc = await gatherImport([new File([new Uint8Array([0xD0,0xCF,0x11,0xE0,0xA1,0xB1,0x1A,0xE1,0,0])], "old.doc")]);
  check("an old .doc asks to be saved as .docx", oldDoc.notes.length === 1 && /\.docx/.test(oldDoc.notes[0]), oldDoc.notes);
  const pdfIn = await gatherImport([new File(["%PDF-1.4"], "card.pdf")]);
  check("a PDF goes to the AI, typed as a PDF", pdfIn.attach.length === 1 && pdfIn.attach[0].type === "application/pdf");
  const txtIn = await gatherImport([new File(["Lemon rice\n1 cup rice"], "note.txt", {type:"text/plain"})]);
  check("plain text is passed on as text", /Lemon rice/.test(txtIn.text) && !txtIn.attach.length);
  check("the AI's recipes list is turned into recipe lines",
    fromAiRecipe({name:"X", servings:2, ingredients:["250 g plain flour"], steps:["a"]}).lines[0].qty === 250);

  out.push("");
  out.push("SCANNING");
  check("A4 at 300 dpi is 2480 × 3508 px", mmToPx(210, 300) === 2480 && mmToPx(297, 300) === 3508);
  check("A4 is 595 × 842 pt in a PDF", near(mmToPt(210), 595.27, 0.01) && near(mmToPt(297), 841.89, 0.01));
  const sq = [{x:10,y:20},{x:110,y:15},{x:120,y:95},{x:5,y:90}];
  const hm = squareToQuad(sq);
  check("straightening maps each corner to the one you dragged",
    [[0,0],[1,0],[1,1],[0,1]].map(p => mapPoint(hm, p[0], p[1])).every((c, i) => near(c.x, sq[i].x, 0.01) && near(c.y, sq[i].y, 0.01)));
  const shot = document.createElement("canvas");
  shot.width = 400; shot.height = 300;
  const sctx = shot.getContext("2d");
  sctx.fillStyle = "#101010"; sctx.fillRect(0, 0, 400, 300);
  sctx.fillStyle = "#f4f4f4"; sctx.fillRect(60, 40, 260, 210);
  const fc = autoCorners(shot);
  check("a pale page on a dark table is found within 20 px",
    Math.abs(fc[0].x - 60) < 20 && Math.abs(fc[0].y - 40) < 20 && Math.abs(fc[2].x - 320) < 20 && Math.abs(fc[2].y - 250) < 20, fc);
  const tall = {corners:[{x:0,y:0},{x:300,y:0},{x:300,y:400},{x:0,y:400}]};
  const pp = pageGeometry(tall, {sizeId:"pp3545", dpi:300, marginMm:6, orient:"auto"});
  check("a passport photo is 413 × 531 px at 300 dpi, no border",
    pp.pageW === 413 && pp.pageH === 531 && pp.contentW === pp.pageW, pp);
  const a4 = pageGeometry(tall, {sizeId:"a4", dpi:200, marginMm:6, orient:"auto"});
  check("A4 keeps the white border and the scan's shape",
    a4.pageW === 1654 && a4.contentW <= a4.pageW - mmToPx(6, 200)*2 + 1 && near(a4.contentW / a4.contentH, 0.75, 0.02), a4);
  const wideScan = {corners:[{x:0,y:0},{x:400,y:0},{x:400,y:300},{x:0,y:300}]};
  check("a landscape scan turns A4 sideways", (g => g.pageW > g.pageH)(pageGeometry(wideScan, {sizeId:"a4", dpi:150, marginMm:0, orient:"auto"})));
  const custom = pageGeometry(wideScan, {sizeId:"custom", customW:300, customH:200, dpi:100, marginMm:0, orient:"portrait"});
  check("a custom size asked for portrait comes out portrait", custom.pageH > custom.pageW, custom);

  const sample = document.createElement("canvas");
  sample.width = 600; sample.height = 800;
  const smx = sample.getContext("2d");
  const grad = smx.createLinearGradient(0, 0, 600, 800);
  grad.addColorStop(0, "#ffffff"); grad.addColorStop(1, "#6e2e58");
  smx.fillStyle = grad; smx.fillRect(0, 0, 600, 800);
  smx.fillStyle = "#000"; smx.font = "40px serif";
  for(let i = 0; i < 12; i++) smx.fillText("Invoice line " + i, 30, 80 + i*60);
  const squeezed = await encodeUnder(sample, "image/jpeg", 40 * 1024);
  check("a 40 KB limit is met", squeezed.fits && squeezed.blob.size <= 40*1024, squeezed.blob.size);
  const plainJ = await encodeUnder(sample, "image/jpeg", 0);
  const jb = new Uint8Array(await plainJ.blob.arrayBuffer());
  const pitem = {jpeg:jb, pxW:600, pxH:800, wPt:mmToPt(210), hPt:mmToPt(297), drawX:0, drawY:0, drawW:mmToPt(210), drawH:mmToPt(297)};
  const pdf = buildPdf([pitem, pitem]);
  const whole = await pdf.text();
  check("the PDF starts with %PDF and ends with %%EOF", whole.indexOf("%PDF-") === 0 && /%%EOF\s*$/.test(whole));
  check("a two-page PDF declares two pages", /\/Count 2/.test(whole));

  /* a page with a shadow over its right side, black writing, and a blue pen line */
  const shade = () => {
    const c = document.createElement("canvas");
    c.width = 400; c.height = 500;
    const x = c.getContext("2d");
    const gr = x.createLinearGradient(0, 0, 400, 0);
    gr.addColorStop(0, "rgb(245,243,238)"); gr.addColorStop(0.5, "rgb(230,228,222)"); gr.addColorStop(1, "rgb(115,112,108)");
    x.fillStyle = gr; x.fillRect(0, 0, 400, 500);
    x.fillStyle = "rgb(30,30,30)";
    for(let i = 0; i < 8; i++) x.fillRect(20, 40 + i*50, 360, 5);
    x.fillStyle = "rgb(40,60,170)"; x.fillRect(20, 460, 360, 5);
    return c;
  };
  const px2 = (c, xx, yy) => Array.from(c.getContext("2d").getImageData(xx, yy, 1, 1).data).slice(0, 3);
  const docC = applyFilter(shade(), "doc");
  check("Document: paper in the shadow comes out white", px2(docC, 380, 20).every(v => v >= 235), px2(docC, 380, 20));
  check("Document: writing in the shadow stays dark", px2(docC, 370, 42).every(v => v < 90), px2(docC, 370, 42));
  check("Document: writing in the light stays dark", px2(docC, 30, 42).every(v => v < 90), px2(docC, 30, 42));
  const blue = px2(docC, 60, 462);
  check("Document: blue pen stays blue", blue[2] > blue[0] + 80, blue);
  const bwC = applyFilter(shade(), "bw");
  check("Black & white: shadowed paper is pure white, writing black",
    px2(bwC, 380, 20)[0] === 255 && px2(bwC, 370, 42)[0] === 0, [px2(bwC, 380, 20)[0], px2(bwC, 370, 42)[0]]);
  const big = document.createElement("canvas");
  big.width = 3000; big.height = 2000;
  const bx = big.getContext("2d");
  bx.fillStyle = "#777"; bx.fillRect(0, 0, 3000, 2000);
  bx.fillStyle = "#fff"; bx.fillRect(1000, 300, 1000, 1400);
  bx.fillStyle = "#000";
  for(let xx = 1000; xx < 2000; xx += 4) bx.fillRect(xx, 300, 2, 1400);
  const sharp = warpQuad(big, [{x:1000,y:300},{x:2000,y:300},{x:2000,y:1700},{x:1000,y:1700}], 800, 1120);
  const row = sharp.getContext("2d").getImageData(0, 560, 800, 1).data;
  let lo = 255, hi = 0;
  for(let i = 0; i < 800; i++){ lo = Math.min(lo, row[i*4]); hi = Math.max(hi, row[i*4]); }
  check("fine lines on a page that fills little of the photo stay crisp", hi - lo > 150, [lo, hi]);

  out.push(fail ? fail + " FAILED, " + pass + " passed" : "All " + pass + " checks passed.");

  document.getElementById("root").append(
    el("div", {id:"testout"},
      el("h1", {style:"font-family:var(--display);font-size:22px;margin-bottom:12px"}, "Kitchen Book — maths check"),
      out.join("\n")));
}

/* ======================= boot ======================= */
let renderQueued = false;
function scheduleRender(){
  if(renderQueued) return;
  renderQueued = true;
  /* A timer, not requestAnimationFrame: rAF is paused while the page is hidden,
     which would leave data that arrived in the background unrendered. */
  setTimeout(() => { renderQueued = false; render(); }, 16);
}

/* Cache the app itself so it opens with no signal. */
function registerWorker(){
  if(!("serviceWorker" in navigator)) return;
  if(location.protocol !== "https:" && location.hostname !== "localhost") return;
  navigator.serviceWorker.register("sw.js").catch(e => console.warn("offline cache unavailable", e));
}

async function boot(){
  let wantsTest = false;
  try { wantsTest = new URLSearchParams(location.search).has("selftest") || location.hash === "#selftest"; } catch(e){}
  if(wantsTest){
    document.getElementById("root").textContent = "";
    runSelfTest();
    return;
  }
  S.route = parseHash();
  window.addEventListener("hashchange", () => { S.route = parseHash(); S.ui.scale = 1; render(); });
  document.addEventListener("click", e => {
    const a = e.target.closest && e.target.closest('a[href^="#/"]');
    if(a){ e.preventDefault(); go(a.getAttribute("href").slice(2)); }
  });

  S.mode = await Store.init();
  render();

  const arrived = {};
  const collections = ["settings","suppliers","ingredients","prices","recipes","feed","shopping"];
  const onArrive = async (name) => {
    arrived[name] = true;
    if(collections.every(c => arrived[c]) && !S.loaded){
      S.loaded = true;
      await maybeSeed();
      pruneFeed();
      scheduleRender();
    }
  };

  Store.watch("settings", docs => {
    const app = docs.find(d => d.id === "app") || {};
    S.settings = Object.assign({}, DEFAULT_SETTINGS, app);
    S.settings.taste = Object.assign({}, DEFAULT_SETTINGS.taste, app.taste || {});
    scheduleRender(); onArrive("settings");
  });
  Store.watch("suppliers",   docs => { S.suppliers = docs; scheduleRender(); onArrive("suppliers"); });
  Store.watch("ingredients", docs => { S.ingredients = docs; scheduleRender(); onArrive("ingredients"); });
  Store.watch("prices",      docs => { S.prices = docs; scheduleRender(); onArrive("prices"); });
  Store.watch("recipes",     docs => { S.recipes = docs; scheduleRender(); onArrive("recipes"); });
  Store.watch("feed",        docs => { S.feed = docs; scheduleRender(); onArrive("feed"); });
  Store.watch("shopping",    docs => {
    const cur = docs.find(d => d.id === "current");
    S.shopping = {recipes:(cur && cur.recipes) || {}, extras:(cur && cur.extras) || [], useStock:!(cur && cur.useStock === false)};
    scheduleRender(); onArrive("shopping");
  });

  initSample();
  registerWorker();
}

boot();
})();
