/* ======================= import recipes from files =======================
   Word and Excel files are zip archives of XML, so they are opened here
   without any library: the zip is read by hand and each part is inflated
   with the browser's own DecompressionStream. */
async function readZip(buf){
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  let eocd = -1;
  for(let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--){
    if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) throw {code:"bad_file"};
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const entries = {};
  const utf8 = new TextDecoder("utf-8");
  for(let n = 0; n < count; n++){
    if(dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true);
    const csize = dv.getUint32(p + 20, true);
    const nameLen = dv.getUint16(p + 28, true), extraLen = dv.getUint16(p + 30, true), noteLen = dv.getUint16(p + 32, true);
    const local = dv.getUint32(p + 42, true);
    entries[utf8.decode(u8.subarray(p + 46, p + 46 + nameLen))] = {method:method, csize:csize, local:local};
    p += 46 + nameLen + extraLen + noteLen;
  }
  return {
    names: Object.keys(entries),
    async text(name){
      const e = entries[name];
      if(!e) return null;
      const start = e.local + 30 + dv.getUint16(e.local + 26, true) + dv.getUint16(e.local + 28, true);
      const data = u8.subarray(start, start + e.csize);
      let out;
      if(e.method === 0) out = data;
      else if(e.method === 8){
        if(typeof DecompressionStream === "undefined") throw {code:"old_browser"};
        const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
        out = new Uint8Array(await new Response(stream).arrayBuffer());
      } else throw {code:"bad_file"};
      return utf8.decode(out);
    }
  };
}
const parseXml = s => new DOMParser().parseFromString(s, "application/xml");
function byLocal(root, name){
  const out = [];
  const walk = n => { for(const c of n.children){ if(c.localName === name) out.push(c); walk(c); } };
  walk(root.documentElement || root);
  return out;
}
const kids = (node, name) => [...node.children].filter(c => c.localName === name);
const textIn = (node, name) => byLocal(node, name).map(t => t.textContent).join("");

/* Word: paragraphs become lines; table rows become "cell | cell | cell". */
async function docxText(zip){
  const xml = await zip.text("word/document.xml");
  if(!xml) throw {code:"bad_file"};
  const doc = parseXml(xml);
  const lines = [];
  const runs = p => {
    let s = "";
    const walk = n => {
      for(const c of n.children){
        if(c.localName === "t") s += c.textContent;
        else if(c.localName === "tab") s += "\t";
        else if(c.localName === "br" || c.localName === "cr") s += "\n";
        else walk(c);
      }
    };
    walk(p);
    return s;
  };
  const block = n => {
    for(const c of n.children){
      if(c.localName === "p") lines.push(runs(c));
      else if(c.localName === "tbl"){
        for(const tr of kids(c, "tr"))
          lines.push(kids(tr, "tc").map(tc => byLocal(tc, "p").map(runs).join(" ").trim()).join(" | "));
      } else block(c);
    }
  };
  const body = byLocal(doc, "body")[0];
  if(body) block(body);
  return lines.join("\n").replace(/\n{3,}/g, "\n\n").trim();
}

/* Excel: every sheet, as rows of cell text. */
function colIndex(ref){
  const m = /^([A-Z]+)/.exec(ref || "");
  if(!m) return -1;
  let n = 0;
  for(const ch of m[1]) n = n * 26 + (ch.charCodeAt(0) - 64);
  return n - 1;
}
async function xlsxSheets(zip){
  const shared = [];
  const ss = await zip.text("xl/sharedStrings.xml");
  if(ss) for(const si of byLocal(parseXml(ss), "si")) shared.push(textIn(si, "t"));
  const wb = parseXml((await zip.text("xl/workbook.xml")) || "<x/>");
  const rels = parseXml((await zip.text("xl/_rels/workbook.xml.rels")) || "<x/>");
  const target = {};
  for(const r of byLocal(rels, "Relationship")) target[r.getAttribute("Id")] = r.getAttribute("Target") || "";
  const sheets = [];
  for(const s of byLocal(wb, "sheet")){
    const rid = s.getAttribute("r:id") ||
      s.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships", "id");
    let path = target[rid];
    if(!path) continue;
    path = path.replace(/^\//, "");
    if(path.indexOf("xl/") !== 0) path = "xl/" + path;
    const xml = await zip.text(path);
    if(!xml) continue;
    const rows = [];
    for(const row of byLocal(parseXml(xml), "row")){
      const cells = [];
      for(const c of kids(row, "c")){
        let col = colIndex(c.getAttribute("r"));
        if(col < 0) col = cells.length;
        const t = c.getAttribute("t");
        const v = kids(c, "v")[0];
        cells[col] = t === "s" ? (v ? (shared[+v.textContent] || "") : "")
          : t === "inlineStr" ? textIn(c, "t")
          : (v ? v.textContent : "");
      }
      rows.push(Array.from(cells, x => x == null ? "" : String(x)));
    }
    sheets.push({name: s.getAttribute("name") || "Sheet", rows: rows});
  }
  return sheets;
}

/* CSV or tab-separated text, quotes respected. */
function parseDelimited(text){
  text = String(text).replace(/^﻿/, "");
  const first = text.split(/\r?\n/, 1)[0] || "";
  const delim = (first.match(/\t/g) || []).length > (first.match(/,/g) || []).length ? "\t"
    : (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ";" : ",";
  const rows = [];
  let row = [], cell = "", quoted = false;
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    if(quoted){
      if(ch === '"'){ if(text[i+1] === '"'){ cell += '"'; i++; } else quoted = false; }
      else cell += ch;
    } else if(ch === '"') quoted = true;
    else if(ch === delim){ row.push(cell); cell = ""; }
    else if(ch === "\n" || ch === "\r"){
      if(ch === "\r" && text[i+1] === "\n") i++;
      row.push(cell); rows.push(row); row = []; cell = "";
    } else cell += ch;
  }
  if(cell || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim()));
}

/* A sheet with "Recipe" and "Ingredient" columns becomes recipes directly —
   no AI, nothing leaves the phone. Rows with the recipe cell left empty
   belong to the recipe above, the way people usually lay these out. */
function tableRecipes(rows){
  for(let h = 0; h < Math.min(6, rows.length); h++){
    const head = rows[h].map(x => String(x || "").trim().toLowerCase());
    const col = re => head.findIndex(x => re.test(x));
    const cRecipe = col(/^(recipe|dish|menu item|item name|recipe name|dish name)\b/);
    const cIng = col(/ingredient/);
    if(cRecipe < 0 || cIng < 0 || cRecipe === cIng) continue;
    const cQty = col(/^(qty|quantity|amount|qnty)\b/), cUnit = col(/^(unit|units|uom|measure)\b/);
    const cServ = col(/serv|portion|yield|pax/), cSteps = col(/method|step|instruction|direction|procedure/);
    const cCuisine = col(/cuisine|category/), cWaste = col(/waste/);
    const out = [];
    let cur = null;
    for(let r = h + 1; r < rows.length; r++){
      const g = i => i >= 0 ? String(rows[r][i] == null ? "" : rows[r][i]).trim() : "";
      const name = g(cRecipe);
      if(name && (!cur || cur.name !== name)){
        cur = {name:name, servings:num(g(cServ)) || 0, cuisine:g(cCuisine), lines:[], steps:[], notes:""};
        out.push(cur);
      }
      if(!cur) continue;
      if(!cur.servings && num(g(cServ)) > 0) cur.servings = num(g(cServ));
      const ing = g(cIng);
      if(ing){
        let qty = cQty >= 0 ? parseFraction(g(cQty)) : NaN;
        let unitWord = g(cUnit).toLowerCase().replace(/\.$/, "");
        let rawName = ing;
        if(!isFinite(qty)){ const p = parseIngredientLine(ing); qty = p.qty; unitWord = unitWord || p.unit; rawName = p.rawName; }
        const unit = UNIT_ALIASES[unitWord] || (UNITS[unitWord] ? unitWord : "each");
        cur.lines.push({rawName:rawName, qty: isFinite(qty) ? qty : 1, unit:unit, wastePct: num(g(cWaste)) || 0});
      }
      const step = g(cSteps);
      if(step) step.split(/\n+/).map(s => s.trim()).filter(Boolean).forEach(s => cur.steps.push(s));
    }
    return out.filter(x => x.lines.length || x.steps.length);
  }
  return null;
}
const rowsToText = rows => rows.map(r => r.join(" | ")).join("\n");

const RECIPES_SCHEMA = {type:"object", additionalProperties:false, required:["recipes"],
  properties:{recipes:{type:"array", items:RECIPE_SCHEMA}}};

function importPrompt(text, hasFiles){
  return "You are reading recipes out of a document for a cook's recipe book.\n" +
    "Find every recipe in it. For each give: name; cuisine if stated or obvious; servings as a number " +
    "(if not stated, estimate from the quantities, or use 4); prepMin and cookMin as numbers (0 if unknown); tags; " +
    "ingredients, each written \"<quantity> <unit> <name>\" with the quantities exactly as in the source " +
    "(write just the name when no quantity is given); steps, the method in order, one step per item; " +
    "notes, anything else useful, briefly.\n" +
    "Never invent a recipe, ingredient, quantity or step that is not in the source. " +
    "If there are no recipes, return an empty list.\n" +
    "Ingredient names this cook already buys: " + pantryLine() + ". Use those names when they clearly mean the same thing.\n" +
    'Reply with only JSON: {"recipes":[{"name":string,"cuisine":string,"servings":number,"prepMin":number,' +
    '"cookMin":number,"tags":[string],"ingredients":[string],"steps":[string],"notes":string}]}' +
    (hasFiles ? "\n\nThe attached files are part of the document." : "") +
    (text ? "\n\nDOCUMENT:\n" + text : "");
}

/* Read what the files hold. Returns recipes already understood, plus the
   text and files that still need the AI to read them. */
async function gatherImport(files){
  const direct = [], texts = [], attach = [], notes = [];
  for(const f of files){
    const name = f.name || "file";
    const ext = (name.split(".").pop() || "").toLowerCase();
    const head = new Uint8Array(await f.slice(0, 8).arrayBuffer());
    if(head[0] === 0xD0 && head[1] === 0xCF && head[2] === 0x11 && head[3] === 0xE0){
      notes.push(name + " is an old Word or Excel format. Open it and use Save As .docx or .xlsx, then import that.");
      continue;
    }
    if(ext === "pdf" || f.type === "application/pdf"){ attach.push(f.type ? f : new File([f], name, {type:"application/pdf"})); continue; }
    if(/^image\//.test(f.type) || /^(jpe?g|png|webp|gif)$/.test(ext)){
      attach.push(f.type ? f : new File([f], name, {type:"image/" + (ext === "jpg" ? "jpeg" : ext)}));
      continue;
    }
    if(ext === "docx"){
      const text = await docxText(await readZip(await f.arrayBuffer()));
      if(text) texts.push("--- " + name + " ---\n" + text);
      continue;
    }
    if(ext === "xlsx" || ext === "xlsm"){
      const sheets = await xlsxSheets(await readZip(await f.arrayBuffer()));
      for(const sh of sheets){
        const found = tableRecipes(sh.rows);
        if(found && found.length) direct.push.apply(direct, found);
        else if(sh.rows.length) texts.push("--- " + name + ", sheet " + sh.name + " ---\n" + rowsToText(sh.rows));
      }
      continue;
    }
    const raw = await f.text();
    if(ext === "json"){
      try {
        const data = JSON.parse(raw);
        const list = Array.isArray(data) ? data : data.recipes;
        if(Array.isArray(list) && list.length && list[0] && (list[0].lines || list[0].ingredients)){
          list.forEach(r => direct.push({
            name:r.name || "Untitled", servings:num(r.servings) || 0, cuisine:r.cuisine || "",
            lines: r.lines || linesFromStrings(r.ingredients || []), steps:r.steps || [], notes:r.notes || "",
            prepMin:num(r.prepMin) || 0, cookMin:num(r.cookMin) || 0, tags:r.tags || []
          }));
          continue;
        }
      } catch(e){}
    }
    if(ext === "csv" || ext === "tsv"){
      const rows = parseDelimited(raw);
      const found = tableRecipes(rows);
      if(found && found.length){ direct.push.apply(direct, found); continue; }
      texts.push("--- " + name + " ---\n" + rowsToText(rows));
      continue;
    }
    if(raw.trim()) texts.push("--- " + name + " ---\n" + raw);
  }
  return {direct:direct, text:texts.join("\n\n").slice(0, 120000), attach:attach, notes:notes};
}

function fromAiRecipe(r){
  return {
    name: r.name || "Untitled", cuisine: r.cuisine || "", servings: num(r.servings) || 0,
    prepMin: num(r.prepMin) || 0, cookMin: num(r.cookMin) || 0, tags: r.tags || [],
    lines: linesFromStrings(r.ingredients || []), steps: r.steps || [], notes: r.notes || ""
  };
}
function importErrorText(e){
  const map = {
    bad_file: "That file could not be opened. It may be damaged or password protected.",
    old_browser: "This phone's browser is too old to open Word or Excel files. Update Chrome, or save the file as text or PDF.",
    needs_ai: "Only the AI can read this file. Add a free Gemini key under Settings, or use an Excel sheet with Recipe and Ingredient columns."
  };
  return (e && map[e.code]) || sampleErrorText(e);
}

function openFileImport(presetFiles){
  let phase = "pick", found = [], errText = null, ctl = null, notes = [], how = "";
  const picker = el("input", {type:"file", multiple:"multiple", style:"display:none",
    accept:".docx,.xlsx,.xlsm,.csv,.tsv,.txt,.md,.json,.pdf,image/*,application/pdf,text/plain",
    onchange:e => { const files = [...e.target.files]; e.target.value = ""; if(files.length) run(files); }});

  const run = async files => {
    phase = "reading"; errText = null; notes = []; ctl = new AbortController(); renderModal();
    try {
      const g = await gatherImport(files);
      notes = g.notes;
      let recipes = g.direct.slice(), usedAi = false;
      if(g.text || g.attach.length){
        if(!S.sampleReady){
          if(!recipes.length) throw {code:"needs_ai"};
          notes.push("Some of it needs the AI to read, and no AI key is set — only the table recipes were read.");
        } else {
          const out = await sampleFn.json(importPrompt(g.text, g.attach.length > 0),
            {signal:ctl.signal, schema:RECIPES_SCHEMA, files:g.attach, cache:false});
          const list = Array.isArray(out) ? out : (out && out.recipes) || [];
          recipes = recipes.concat(list.map(fromAiRecipe));
          usedAi = true;
        }
      }
      found = recipes.filter(r => r.name && (r.lines.length || r.steps.length)).map(r => Object.assign({keep:true}, r));
      how = usedAi ? (g.direct.length ? "Tables read directly; the rest by " + AI.label() + "."
                                      : "Read by " + AI.label() + ". Check them before saving.")

      phase = found.length ? "review" : "pick";
      if(!found.length) errText = notes.length ? null : "No recipes were found in that.";
    } catch(e){

      if(!e || e.code !== "cancelled") errText = importErrorText(e);
    }
    renderModal();
  };

  const save = async () => {
    const keep = found.filter(r => r.keep);
    for(const r of keep){
      await Store.save("recipes", null, {

          return Object.assign({wastePct:0, note:""}, l, {ingredientId: ing ? ing.id : null});
        }),
        steps:r.steps || [], prepMin:r.prepMin || 0, cookMin:r.cookMin || 0,
        source:"import", sourceUrl:"", notes:r.notes || "", business:{}, favorite:false,
        createdAt:new Date().toISOString()
      });
    }
    closeModal();
    toast("Imported " + keep.length + " " + pluralise(keep.length, "recipe"));
    go("recipes");
  };

  openModal({
    wide:true, title:"Import recipes from a file", noAutofocus:true,
    body: () => {
      if(phase === "reading") return thinkingBlock("Reading the file…", () => ctl && ctl.abort());
      if(phase === "review"){
        const n = found.filter(r => r.keep).length;
        return frag(
          el("div", {class:"hint"}, how),
          notes.length ? el("div", {class:"banner"}, el("div", null, notes.join(" "))) : null,
          el("div", {class:"stack", style:"gap:8px"}, found.map(r => {
            const linked = r.lines.filter(l => (l.ingredientId && S.ix.ing[l.ingredientId]) || matchIngredient(l.rawName)).length;
            return el("label", {class:"panel", style:"display:flex;gap:12px;align-items:flex-start;padding:12px;cursor:pointer" + (r.keep ? "" : ";opacity:.55")},
              el("input", {type:"checkbox", checked:r.keep, style:"margin-top:4px;width:18px;height:18px",
                onchange:e => { r.keep = e.target.checked; renderModal(); }}),
              el("div", {style:"min-width:0"},
                el("div", {class:"name"}, r.name),
                el("div", {class:"sub2"},
                  [r.cuisine, (r.servings || 4) + " " + pluralise(r.servings || 4, "serving"),
                   r.lines.length + " " + pluralise(r.lines.length, "ingredient"),
                   r.steps.length ? r.steps.length + " " + pluralise(r.steps.length, "step") : "no method"]
                  .filter(Boolean).join("  ·  ")),
                r.lines.length ? el("div", {class:"hint", style:"margin-top:4px"},
                  r.lines.slice(0, 5).map(l => l.rawName).join(", ") + (r.lines.length > 5 ? "…" : "")) : null,
                el("div", {style:"margin-top:6px"},
                  el("span", {class:"pill " + (linked === r.lines.length && r.lines.length ? "good" : "flat")},
                    linked + " of " + r.lines.length + " match your ingredients"))));
          })),
          el("div", {class:"hint"}, n + " of " + found.length + " will be saved. Unmatched ingredients can be linked afterwards on each recipe."));
      }
      return frag(
        errText ? el("div", {class:"banner"}, el("div", null, errText)) : null,
        notes.length ? el("div", {class:"banner"}, el("div", null, notes.join(" "))) : null,
        el("div", {class:"empty", style:"padding:22px"},
          el("h3", null, "Choose one or more files"),
          el("div", null, "Word (.docx), Excel (.xlsx), CSV, PDF, text, or a photo of a recipe."),
          el("div", {style:"margin-top:14px"}, btn("Choose files", {cls:"primary", icon:"down", onClick:() => picker.click()}))),
        picker,
        el("div", {class:"hint"},
          el("b", null, "No AI needed: "),
          "an Excel or CSV sheet with a Recipe column and an Ingredient column (Quantity, Unit, Servings and Method columns optional) is read directly. ",
          "Rows with the Recipe cell left blank belong to the recipe above."),
        el("div", {class:"hint"},
          el("b", null, "With AI: "),
          "Word documents, PDFs, photos and loose text are read by " + AI.label() + (S.sampleReady ? "." : " once you add a key under Settings.")));
    },
    footer: () => phase === "review"
      ? frag(btn("Back", {cls:"ghost", onClick:() => { phase = "pick"; renderModal(); }}),
             btn((n => "Save " + n + " " + pluralise(n, "recipe"))(found.filter(r => r.keep).length), {cls:"primary", icon:"save",
               disabled:!found.some(r => r.keep), onClick:save}))
      : btn("Close", {cls:"ghost", onClick:closeModal})
  });
  if(presetFiles && presetFiles.length) run(presetFiles);
}

async function offerFile(filename, text){
  /* Inside the installed app there is no browser download; show the text to copy. */
  if(!window.Capacitor) try {
    const url = URL.createObjectURL(new Blob([text], {type:"application/octet-stream"}));
    const a = el("a", {href:url, download:filename});
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast("Saved to your downloads");
    return;
  } catch(e){ /* fall through to copy */ }
  if(window.Capacitor && capPlugin("Filesystem")){
    if(await saveBlob(filename, new Blob([text], {type:filename.endsWith(".json") ? "application/json" : "text/plain"}))) return;
  }
  openModal({
    wide:true, title:"Copy your data",
    body: () => frag(
      el("div", {class:"hint"}, "Select all of this and paste it somewhere safe."),
      el("textarea", {style:"min-height:300px;font-family:var(--mono);font-size:12px"}, text)),
    footer: () => btn("Done", {cls:"primary", onClick:closeModal})
  });
}

/* ======================= SCAN — the image engine =======================
   Ported from Paper Trail: paper sizes, straightening a photographed page,
   finding its edges, squeezing it under a size, and writing a PDF by hand. */
/* ======================= paper sizes ======================= */
/* Every size is held in millimetres; inches are converted once, here. */
const IN = 25.4;
const PAGE_SIZES = [
  {id:"a4",      label:"A4",                 w:210,    h:297,    kind:"doc"},
  {id:"a5",      label:"A5",                 w:148,    h:210,    kind:"doc"},
  {id:"letter",  label:"Letter",             w:8.5*IN, h:11*IN,  kind:"doc"},
  {id:"legal",   label:"Legal",              w:8.5*IN, h:14*IN,  kind:"doc"},
  {id:"pp3545",  label:"Passport 35 × 45 mm",w:35,     h:45,     kind:"photo"},
  {id:"us2x2",   label:"US photo 2 × 2 in",  w:2*IN,   h:2*IN,   kind:"photo"},
  {id:"p2535",   label:"Photo 25 × 35 mm",   w:25,     h:35,     kind:"photo"},
  {id:"p4x6",    label:"Photo 4 × 6 in",     w:4*IN,   h:6*IN,   kind:"photo"},
  {id:"square",  label:"Square 1000 px",     w:0,      h:0,      kind:"photo", px:1000},
  {id:"custom",  label:"Custom size",        w:210,    h:297,    kind:"doc"}
];
const DPIS = [150, 200, 300];
const mmToPx = (mm, dpi) => Math.max(1, Math.round(mm / IN * dpi));
const mmToPt = mm => mm * 72 / IN;
const fmtBytes = n => n < 1024 ? n + " B"
  : n < 1024*1024 ? (n/1024).toFixed(n < 10240 ? 1 : 0) + " KB"
  : (n/1048576).toFixed(2) + " MB";

/* ======================= geometry ======================= */
/* Maps the unit square onto the four corners the user dragged, so the page can
   be un-skewed: the standard projective mapping, corners in the order
   top-left, top-right, bottom-right, bottom-left. */
function squareToQuad(q){
  const x0 = q[0].x, y0 = q[0].y, x1 = q[1].x, y1 = q[1].y;
  const x2 = q[2].x, y2 = q[2].y, x3 = q[3].x, y3 = q[3].y;
  const dx1 = x1 - x2, dx2 = x3 - x2, dy1 = y1 - y2, dy2 = y3 - y2;
  const sx = x0 - x1 + x2 - x3, sy = y0 - y1 + y2 - y3;
  let g = 0, h = 0;
  if(sx !== 0 || sy !== 0){
    const den = dx1*dy2 - dx2*dy1;
    if(Math.abs(den) < 1e-12) return null;
    g = (sx*dy2 - dx2*sy) / den;
    h = (dx1*sy - sx*dy1) / den;
  }
  return {
    a: x1 - x0 + g*x1, b: x3 - x0 + h*x3, c: x0,
    d: y1 - y0 + g*y1, e: y3 - y0 + h*y3, f: y0,
    g: g, h: h
  };
}
/* A point of the unit square (u,v) back to where it sits in the photo. */
function mapPoint(m, u, v){
  const den = m.g*u + m.h*v + 1;
  return {x:(m.a*u + m.b*v + m.c) / den, y:(m.d*u + m.e*v + m.f) / den};
}
const dist = (p, q) => Math.hypot(p.x - q.x, p.y - q.y);
/* The shape of the quad, used to keep a document's proportions when fitting. */
function quadAspect(q){
  const w = (dist(q[0], q[1]) + dist(q[3], q[2])) / 2;
  const h = (dist(q[0], q[3]) + dist(q[1], q[2])) / 2;
  return h > 0 ? w / h : 1;
}

/* Pull the quad out of the source and lay it flat into outW × outH. */
function warpQuad(src, quad, outW, outH){
  /* Shrink the photo first only as far as the PAGE keeps 1.5 photo pixels for
     every output pixel, and shrink it smoothly. Sizing this by the whole photo
     used to squash the page below the output size and stretch it back up,
     which is what made scans soft. */
  const across = Math.max(dist(quad[0], quad[1]), dist(quad[3], quad[2]), 1);
  const down = Math.max(dist(quad[0], quad[3]), dist(quad[1], quad[2]), 1);
  const scale = Math.min(1, Math.max(outW * 1.5 / across, outH * 1.5 / down));
  const sw = Math.max(1, Math.round(src.width * scale));
  const sh = Math.max(1, Math.round(src.height * scale));
  const sc = document.createElement("canvas");
  sc.width = sw; sc.height = sh;
  const sctx = sc.getContext("2d", {willReadFrequently:true});
  sctx.imageSmoothingEnabled = true;
  sctx.imageSmoothingQuality = "high";
  sctx.drawImage(src, 0, 0, sw, sh);
  const sdata = sctx.getImageData(0, 0, sw, sh).data;

  const m = squareToQuad(quad.map(p => ({x:p.x * scale, y:p.y * scale})));
  const out = document.createElement("canvas");
  out.width = outW; out.height = outH;
  const octx = out.getContext("2d", {willReadFrequently:true});
  const odata = octx.createImageData(outW, outH);
  const o = odata.data;
  if(!m){ octx.fillStyle = "#fff"; octx.fillRect(0, 0, outW, outH); return out; }

  for(let y = 0; y < outH; y++){
    const v = (y + 0.5) / outH;
    for(let x = 0; x < outW; x++){
      const u = (x + 0.5) / outW;
      const den = m.g*u + m.h*v + 1;
      const fx = (m.a*u + m.b*v + m.c) / den;
      const fy = (m.d*u + m.e*v + m.f) / den;
      const i = (y*outW + x) * 4;
      if(fx < 0 || fy < 0 || fx > sw - 1 || fy > sh - 1){ o[i] = o[i+1] = o[i+2] = 255; o[i+3] = 255; continue; }
      const x0 = fx | 0, y0 = fy | 0;
      const x1 = x0 + 1 < sw ? x0 + 1 : x0, y1 = y0 + 1 < sh ? y0 + 1 : y0;
      const ax = fx - x0, ay = fy - y0;
      const p00 = (y0*sw + x0)*4, p10 = (y0*sw + x1)*4, p01 = (y1*sw + x0)*4, p11 = (y1*sw + x1)*4;
      const w00 = (1-ax)*(1-ay), w10 = ax*(1-ay), w01 = (1-ax)*ay, w11 = ax*ay;
      o[i]   = sdata[p00]*w00   + sdata[p10]*w10   + sdata[p01]*w01   + sdata[p11]*w11;
      o[i+1] = sdata[p00+1]*w00 + sdata[p10+1]*w10 + sdata[p01+1]*w01 + sdata[p11+1]*w11;
      o[i+2] = sdata[p00+2]*w00 + sdata[p10+2]*w10 + sdata[p01+2]*w01 + sdata[p11+2]*w11;
      o[i+3] = 255;
    }
  }
  octx.putImageData(odata, 0, 0);
  return out;
}

/* ======================= look of the scan ======================= */
const FILTERS = [
  {id:"doc",      label:"Document"},
  {id:"original", label:"Photo"},
  {id:"bw",       label:"Black & white"},
  {id:"grey",     label:"Grey"},
  {id:"boost",    label:"Brighten"}
];
/* Sliding maximum and box average along rows, then columns. */
function maxFilter(a, w, h, r){
  const t = new Float32Array(w*h), o = new Float32Array(w*h);
  for(let y = 0; y < h; y++) for(let x = 0; x < w; x++){
    let m = 0;
    for(let k = Math.max(0, x-r), e = Math.min(w-1, x+r); k <= e; k++) if(a[y*w+k] > m) m = a[y*w+k];
    t[y*w+x] = m;
  }
  for(let y = 0; y < h; y++) for(let x = 0; x < w; x++){
    let m = 0;
    for(let k = Math.max(0, y-r), e = Math.min(h-1, y+r); k <= e; k++) if(t[k*w+x] > m) m = t[k*w+x];
    o[y*w+x] = m;
  }
  return o;
}
function boxBlur(a, w, h, r){
  const t = new Float32Array(w*h), o = new Float32Array(w*h);
  for(let y = 0; y < h; y++) for(let x = 0; x < w; x++){
    let s = 0, n = 0;
    for(let k = Math.max(0, x-r), e = Math.min(w-1, x+r); k <= e; k++){ s += a[y*w+k]; n++; }
    t[y*w+x] = s / n;
  }
  for(let y = 0; y < h; y++) for(let x = 0; x < w; x++){
    let s = 0, n = 0;
    for(let k = Math.max(0, y-r), e = Math.min(h-1, y+r); k <= e; k++){ s += t[k*w+x]; n++; }
    o[y*w+x] = s / n;
  }
  return o;
}
/* The paper's own colour at every point of the page, from a small copy:
   the brightest value nearby steps over the ink, and smoothing removes the
   blockiness. Dividing by it turns shadows and yellowed paper white while the
   writing keeps its soft edges — the way WhatsApp and CamScanner clean a page. */
function paperMap(canvas){
  const W = canvas.width, H = canvas.height;
  const f = Math.min(1, 160 / Math.max(W, H));
  const w = Math.max(8, Math.round(W * f)), h = Math.max(8, Math.round(H * f));
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const cx = c.getContext("2d", {willReadFrequently:true});
  cx.imageSmoothingQuality = "high";
  cx.drawImage(canvas, 0, 0, w, h);
  const d = cx.getImageData(0, 0, w, h).data;
  const r = Math.max(2, Math.round(Math.max(w, h) / 40));
  const maps = [0, 1, 2].map(ch => {
    let a = new Float32Array(w * h);
    for(let i = 0; i < w*h; i++) a[i] = d[i*4 + ch];
    a = boxBlur(maxFilter(a, w, h, r), w, h, r);
    /* Never lift anything more than about twice: a dark photo or a black box
       on the page should stay dark, not wash out to grey. */
    const sorted = Array.from(a).sort((p, q) => p - q);
    const paper = sorted[Math.floor(sorted.length * 0.9)] || 255;
    for(let i = 0; i < a.length; i++) a[i] = Math.max(a[i], paper * 0.5, 1);
    return a;
  });
  return {maps:maps, w:w, h:h, fx:w / W, fy:h / H};
}
function applyFilter(canvas, filter){
  if(filter === "original") return canvas;
  const ctx = canvas.getContext("2d", {willReadFrequently:true});
  const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const d = img.data, n = canvas.width * canvas.height;

  if(filter === "doc" || filter === "bw"){
    const W = canvas.width, H = canvas.height;
    const pm = paperMap(canvas), mw = pm.w, mh = pm.h;
    /* tone curves: paper to pure white, ink a little deeper, edges kept smooth */
    const docLut = new Uint8ClampedArray(256), bwLut = new Uint8ClampedArray(256);
    for(let v = 0; v < 256; v++){
      const t = Math.max(0, Math.min(1, (v / 255 - 0.08) / 0.78));
      docLut[v] = Math.round(255 * Math.pow(t, 1.35));
      bwLut[v] = Math.round(255 * Math.max(0, Math.min(1, (v - 140) / 60)));
    }
    const m0 = pm.maps[0], m1 = pm.maps[1], m2 = pm.maps[2];
    for(let y = 0; y < H; y++){
      const sy = Math.max(0, Math.min(mh - 1, (y + 0.5) * pm.fy - 0.5));
      const y0 = sy | 0, y1 = Math.min(mh - 1, y0 + 1), ay = sy - y0;
      for(let x = 0; x < W; x++){
        const sx = Math.max(0, Math.min(mw - 1, (x + 0.5) * pm.fx - 0.5));
        const x0 = sx | 0, x1 = Math.min(mw - 1, x0 + 1), ax = sx - x0;
        const i00 = y0*mw + x0, i10 = y0*mw + x1, i01 = y1*mw + x0, i11 = y1*mw + x1;
        const w00 = (1-ax)*(1-ay), w10 = ax*(1-ay), w01 = (1-ax)*ay, w11 = ax*ay;
        const p = (y*W + x) * 4;
        const r = Math.min(255, d[p]   * 255 / (m0[i00]*w00 + m0[i10]*w10 + m0[i01]*w01 + m0[i11]*w11)) | 0;
        const g = Math.min(255, d[p+1] * 255 / (m1[i00]*w00 + m1[i10]*w10 + m1[i01]*w01 + m1[i11]*w11)) | 0;
        const b = Math.min(255, d[p+2] * 255 / (m2[i00]*w00 + m2[i10]*w10 + m2[i01]*w01 + m2[i11]*w11)) | 0;
        if(filter === "doc"){ d[p] = docLut[r]; d[p+1] = docLut[g]; d[p+2] = docLut[b]; }
        else { d[p] = d[p+1] = d[p+2] = bwLut[(r*0.299 + g*0.587 + b*0.114) | 0]; }
      }
    }
  } else if(filter === "grey"){
    for(let i = 0, p = 0; i < n; i++, p += 4)
      d[p] = d[p+1] = d[p+2] = (d[p]*0.299 + d[p+1]*0.587 + d[p+2]*0.114) | 0;
  } else if(filter === "boost"){
    /* Stretch the range between the 2nd and 98th percentile, then lift colour. */
    const hist = new Uint32Array(256);
    for(let i = 0, p = 0; i < n; i++, p += 4)
      hist[(d[p]*0.299 + d[p+1]*0.587 + d[p+2]*0.114) | 0]++;
    let lo = 0, hi = 255, acc = 0;
    const cut = n * 0.02;
    for(let i = 0; i < 256; i++){ acc += hist[i]; if(acc > cut){ lo = i; break; } }
    acc = 0;
    for(let i = 255; i >= 0; i--){ acc += hist[i]; if(acc > cut){ hi = i; break; } }
    const span = Math.max(1, hi - lo);
    for(let i = 0, p = 0; i < n; i++, p += 4){
      const r = (d[p] - lo) * 255 / span, g = (d[p+1] - lo) * 255 / span, b = (d[p+2] - lo) * 255 / span;
      const m = r*0.299 + g*0.587 + b*0.114;
      d[p]   = m + (r - m) * 1.18;
      d[p+1] = m + (g - m) * 1.18;
      d[p+2] = m + (b - m) * 1.18;
    }
  }
  ctx.putImageData(img, 0, 0);
  return canvas;
}

/* Where the page probably sits in the photo. The page is usually the bright
   shape on a darker table, so: split light from dark, then take the four
   outermost points of that shape — which are the corners of a sheet even
   when it was photographed at an angle. A starting point to drag, not a
   promise. */
function greyOf(src, maxSide){
  const scale = Math.min(1, maxSide / Math.max(src.width, src.height));
  const w = Math.max(8, Math.round(src.width * scale)), h = Math.max(8, Math.round(src.height * scale));
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const ctx = c.getContext("2d", {willReadFrequently:true});
  ctx.drawImage(src, 0, 0, w, h);
  const d = ctx.getImageData(0, 0, w, h).data;
  const grey = new Uint8ClampedArray(w * h);
  for(let i = 0, p = 0; i < w*h; i++, p += 4) grey[i] = (d[p]*0.299 + d[p+1]*0.587 + d[p+2]*0.114) | 0;
  return {grey:grey, w:w, h:h, scale:scale};
}
/* The brightness that best separates two groups of pixels (Otsu's method). */
function splitLevel(grey){
  const hist = new Uint32Array(256);
  for(let i = 0; i < grey.length; i++) hist[grey[i]]++;
  const total = grey.length;
  let sum = 0;
  for(let i = 0; i < 256; i++) sum += i * hist[i];
  let sumB = 0, wB = 0, best = 0, bestVar = -1;
  for(let t = 0; t < 256; t++){
    wB += hist[t];
    if(!wB) continue;
    const wF = total - wB;
    if(!wF) break;
    sumB += t * hist[t];
    const mB = sumB / wB, mF = (sum - sumB) / wF;
    const between = wB * wF * (mB - mF) * (mB - mF);
    if(between > bestVar){ bestVar = between; best = t; }
  }
  return best;
}
function cornersFromMask(mask, w, h){
  let area = 0;
  let minSum = Infinity, maxSum = -Infinity, minDiff = Infinity, maxDiff = -Infinity;
  let tl = null, br = null, bl = null, tr = null;
  for(let y = 0; y < h; y++){
    for(let x = 0; x < w; x++){
      if(!mask[y*w + x]) continue;
      area++;
      const s = x + y, df = x - y;
      if(s < minSum){ minSum = s; tl = {x, y}; }
      if(s > maxSum){ maxSum = s; br = {x, y}; }
      if(df < minDiff){ minDiff = df; bl = {x, y}; }
      if(df > maxDiff){ maxDiff = df; tr = {x, y}; }
    }
  }
  if(!tl || area < w*h*0.08) return null;
  const quad = [tl, tr, br, bl];
  const side = [dist(tl, tr), dist(tr, br), dist(br, bl), dist(bl, tl)];
  if(Math.min.apply(null, side) < Math.min(w, h) * 0.12) return null;
  /* How much of the shape's own outline is actually filled in. A sheet of
     paper fills it; scattered text or a table seen around a card does not. */
  let quadArea = 0;
  for(let i = 0; i < 4; i++){
    const p = quad[i], q = quad[(i+1) % 4];
    quadArea += p.x*q.y - q.x*p.y;
  }
  quadArea = Math.abs(quadArea) / 2;
  if(quadArea < w*h*0.06) return null;
  return {quad:quad, fill: area / quadArea, cover: quadArea / (w*h)};
}
/* A page that clearly stands out from what it lies on, or null. */
function pageFromGrey(g){
  const w = g.w, h = g.h, n = w * h;
  const level = splitLevel(g.grey);
  const bright = new Uint8Array(n), dark = new Uint8Array(n);
  for(let i = 0; i < n; i++){ if(g.grey[i] > level) bright[i] = 1; else dark[i] = 1; }
  /* Try both readings — a pale page on a dark table, and a dark card on a pale
     one — and keep whichever forms the more solid shape. */
  const cands = [cornersFromMask(bright, w, h), cornersFromMask(dark, w, h)].filter(Boolean);
  cands.sort((a, b) => (b.fill - a.fill) || (a.cover - b.cover));
  return cands[0] || null;
}
function findPage(src, maxSide){
  const g = greyOf(src, maxSide || 420);
  const hit = pageFromGrey(g);
  return hit ? {quad:hit.quad.map(p => ({x:p.x / g.scale, y:p.y / g.scale})), fill:hit.fill, cover:hit.cover} : null;
}
function autoCorners(src){
  const g = greyOf(src, 420);
  const w = g.w, h = g.h;
  const hit = pageFromGrey(g);
  let quad = hit ? hit.quad : null;

  if(!quad){
    /* Nothing separated cleanly — fall back to where the detail is. */
    const colScore = new Float64Array(w), rowScore = new Float64Array(h);
    for(let y = 1; y < h - 1; y++){
      for(let x = 1; x < w - 1; x++){
        const gx = g.grey[y*w + x + 1] - g.grey[y*w + x - 1];
        const gy = g.grey[(y+1)*w + x] - g.grey[(y-1)*w + x];
        const mag = Math.abs(gx) + Math.abs(gy);
        colScore[x] += mag; rowScore[y] += mag;
      }
    }
    const bounds = (arr, len) => {
      let max = 0;
      for(let i = 0; i < len; i++) if(arr[i] > max) max = arr[i];
      const th = max * 0.22;
      let a = 0, b = len - 1;
      while(a < len && arr[a] < th) a++;
      while(b > a && arr[b] < th) b--;
      return (b - a) > len * 0.3 ? [a, b] : [Math.round(len*0.04), Math.round(len*0.96)];
    };
    const [x0, x1] = bounds(colScore, w), [y0, y1] = bounds(rowScore, h);
    quad = [{x:x0, y:y0}, {x:x1, y:y0}, {x:x1, y:y1}, {x:x0, y:y1}];
  }
  return quad.map(p => ({x: p.x / g.scale, y: p.y / g.scale}));
}
/* ======================= turning it into a file ======================= */
function canvasToBlob(canvas, type, quality){
  return new Promise(resolve => canvas.toBlob(resolve, type, quality));
}
function scaledCanvas(canvas, factor){
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(canvas.width * factor));
  c.height = Math.max(1, Math.round(canvas.height * factor));
  const ctx = c.getContext("2d");
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(canvas, 0, 0, c.width, c.height);
  return c;
}
/* Squeeze under a byte limit: drop quality first, and only shrink the
   picture when quality alone cannot get there. */
async function encodeUnder(canvas, type, limitBytes, onStep){
  const qualities = [0.92, 0.85, 0.78, 0.7, 0.62, 0.54, 0.46, 0.38, 0.3];
  if(type === "image/png" || !limitBytes){
    const blob = await canvasToBlob(canvas, type, type === "image/png" ? undefined : 0.92);
    return {blob:blob, quality: type === "image/png" ? null : 0.92, scale:1, fits: !limitBytes || blob.size <= limitBytes};
  }
  let work = canvas, scale = 1;
  for(let round = 0; round < 5; round++){
    for(const q of qualities){
      if(onStep) onStep();
      const blob = await canvasToBlob(work, type, q);
      if(blob.size <= limitBytes) return {blob:blob, quality:q, scale:scale, fits:true};
    }
    scale *= 0.78;
    work = scaledCanvas(canvas, scale);
  }
  const blob = await canvasToBlob(work, type, 0.3);
  return {blob:blob, quality:0.3, scale:scale, fits: blob.size <= limitBytes};
}

/* ======================= a PDF, written by hand =======================
   Pages holding one JPEG each. Writing the few hundred bytes of PDF
   ourselves keeps the app working with no network and no library. */
function latin1(str){
  const out = new Uint8Array(str.length);
  for(let i = 0; i < str.length; i++) out[i] = str.charCodeAt(i) & 0xff;
  return out;
}
const n2 = v => (Math.round(v * 100) / 100).toString();
function buildPdf(items, title){
  const chunks = [];
  let length = 0;
  const push = bytes => { chunks.push(bytes); length += bytes.length; };
  const pushStr = s => push(latin1(s));
  const offsets = [];
  const startObj = num => { offsets[num] = length; pushStr(num + " 0 obj\n"); };
  const endObj = () => pushStr("endobj\n");

  const pageCount = items.length;
  const objCount = 2 + pageCount * 3;
  pushStr("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n");

  startObj(1);
  pushStr("<< /Type /Catalog /Pages 2 0 R >>\n");
  endObj();

  const kids = [];
  for(let i = 0; i < pageCount; i++) kids.push((3 + i*3) + " 0 R");
  startObj(2);
  pushStr("<< /Type /Pages /Count " + pageCount + " /Kids [" + kids.join(" ") + "] >>\n");
  endObj();

  items.forEach((it, i) => {
    const pageNum = 3 + i*3, contentNum = pageNum + 1, imgNum = pageNum + 2;
    startObj(pageNum);
    pushStr("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + n2(it.wPt) + " " + n2(it.hPt) + "]" +
      " /Resources << /XObject << /Im0 " + imgNum + " 0 R >> >> /Contents " + contentNum + " 0 R >>\n");
    endObj();

    const content = "q\n" + n2(it.drawW) + " 0 0 " + n2(it.drawH) + " " + n2(it.drawX) + " " + n2(it.drawY) + " cm\n/Im0 Do\nQ\n";
    startObj(contentNum);
    pushStr("<< /Length " + content.length + " >>\nstream\n");
    pushStr(content);
    pushStr("endstream\n");
    endObj();

    startObj(imgNum);
    pushStr("<< /Type /XObject /Subtype /Image /Width " + it.pxW + " /Height " + it.pxH +
      " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " + it.jpeg.length + " >>\nstream\n");
    push(it.jpeg);
    pushStr("\nendstream\n");
    endObj();
  });

  const xrefAt = length;
  pushStr("xref\n0 " + (objCount + 1) + "\n0000000000 65535 f \n");
  for(let i = 1; i <= objCount; i++)
    pushStr(String(offsets[i]).padStart(10, "0") + " 00000 n \n");
  pushStr("trailer\n<< /Size " + (objCount + 1) + " /Root 1 0 R >>\nstartxref\n" + xrefAt + "\n%%EOF\n");

  const out = new Uint8Array(length);
  let at = 0;
  for(const c of chunks){ out.set(c, at); at += c.length; }
  return new Blob([out], {type:"application/pdf"});
}

/* ======================= keeping pages between visits ======================= */
const SCAN_DB = "kitchenbook-scans", SCAN_STORE = "pages";
function scanIdb(){
  return new Promise((ok, fail) => {
    const req = indexedDB.open(SCAN_DB, 1);
    req.onupgradeneeded = () => { if(!req.result.objectStoreNames.contains(SCAN_STORE)) req.result.createObjectStore(SCAN_STORE, {keyPath:"id"}); };
    req.onsuccess = () => ok(req.result);
    req.onerror = () => fail(req.error);
  });
}
async function scanDbRun(mode, fn){
  try {
    const db = await scanIdb();
    return await new Promise((ok, fail) => {
      const tx = db.transaction(SCAN_STORE, mode);
      const req = fn(tx.objectStore(SCAN_STORE));
      tx.oncomplete = () => ok(req && req.result);
      tx.onerror = () => fail(tx.error);
    });
  } catch(e){ return null; }
}
const scanDbAll = () => scanDbRun("readonly", s => s.getAll());
const scanDbPut = rec => scanDbRun("readwrite", s => s.put(rec));
const scanDbDel = id => scanDbRun("readwrite", s => s.delete(id));
const scanDbClear = () => scanDbRun("readwrite", s => s.clear());

/* ======================= saving files =======================
   A browser saves through a download link. The installed Android app has no
   downloads, so there the file is written with Capacitor's Filesystem plugin
   and handed to Android's share sheet (Drive, WhatsApp, Files…). */
const capPlugins = {};
function capPlugin(name){
  const C = window.Capacitor;
  if(!C) return null;
  if(capPlugins[name]) return capPlugins[name];
  try {
    if(C.isPluginAvailable && !C.isPluginAvailable(name)) return null;
    capPlugins[name] = (C.Plugins && C.Plugins[name]) || (C.registerPlugin ? C.registerPlugin(name) : null);
  } catch(e){ return null; }
  return capPlugins[name];
}
const inApp = () => !!window.Capacitor;
async function writeInApp(name, blob, where){
  const fs = capPlugin("Filesystem");
  if(!fs) throw new Error("no filesystem");
  const data = await blobToBase64(blob);
  const res = await fs.writeFile({path:(where === "DOCUMENTS" ? "KitchenBook/" : "") + name, data:data,
    directory:where, recursive:true});
  return res && res.uri;
}
/* Returns true when the file ended up somewhere the person can find it. */
async function saveBlob(name, blob){
  if(!inApp()){
    const url = URL.createObjectURL(blob);
    const a = el("a", {href:url, download:name});
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 8000);
    toast("Saved to your downloads");
    return true;
  }
  try {
    await writeInApp(name, blob, "DOCUMENTS");
    toast("Saved in Documents › KitchenBook");
    return true;
  } catch(e){
    /* Some Android versions refuse the shared folder; the share sheet always works. */
    return shareBlob(name, blob);
  }
}
async function shareBlob(name, blob){
  try {
    if(inApp()){
      const share = capPlugin("Share");
      if(!share) throw new Error("no share");
      const uri = await writeInApp(name, blob, "CACHE");
      await share.share({title:name, files:[uri]});
      return true;
    }
    const file = new File([blob], name, {type:blob.type});
    await navigator.share({files:[file], title:name});
    return true;
  } catch(e){
    if(e && (e.name === "AbortError" || /cancel/i.test(e.message || ""))) return false;
    toast("Sharing was not possible here");
    return false;
  }
}
function canShare(name, blob){
  if(inApp()) return !!capPlugin("Share");
  try { return !!(navigator.canShare && navigator.canShare({files:[new File([blob], name, {type:blob.type})]})); }
  catch(e){ return false; }
}

/* ======================= SCAN — pages and paper =======================
   Photograph a document, drag its corners, and save it as a PDF or picture
   at an exact paper size and under a size limit. All on the device. */
const SC = {
  pages: [],        /* {id, blob, rotate, corners[4], filter, name, addedAt, bitmap, thumbUrl} */
  loaded: false, loading: false, busy: false, adding: 0,
  out: null,
  lastOpened: null,
  opts: {sizeId:"a4", customW:210, customH:297, orient:"auto", dpi:300, marginMm:6, format:"pdf", limitKb:0, filename:""},
  edit: null
};
const scanUid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const sizeById = id => PAGE_SIZES.find(s => s.id === id) || PAGE_SIZES[0];

async function scanLoad(){
  if(SC.loaded || SC.loading) return;
  SC.loading = true;
  const recs = (await scanDbAll()) || [];
  recs.sort((a, b) => (a.order || 0) - (b.order || 0));
  SC.pages = recs.map(r => ({id:r.id, blob:r.blob, rotate:r.rotate || 0, corners:r.corners, filter:r.filter || "doc",
    name:r.name || "Scan", addedAt:r.addedAt || Date.now(), cap:r.cap || 0}));
  for(const p of SC.pages){ try { await scanThumb(p); } catch(e){} }
  SC.loaded = true; SC.loading = false;
  scheduleRender();
}
async function bitmapOf(page){
  if(page.bitmap) return page.bitmap;
  try { page.bitmap = await createImageBitmap(page.blob, {imageOrientation:"from-image"}); }
  catch(e){ page.bitmap = await createImageBitmap(page.blob); }
  return page.bitmap;
}
/* The photo with the page's rotation baked in — everything else works on this. */
async function workingCanvas(page){
  const bmp = await bitmapOf(page);
  const turned = page.rotate === 90 || page.rotate === 270;
  const c = document.createElement("canvas");
  /* Pages added since the live camera arrived carry a pixel cap, so a 50 MP
     phone photo cannot exhaust memory. Older pages keep their full size,
     because their corners were placed on it. */
  const k = page.cap ? Math.min(1, Math.sqrt(page.cap / (bmp.width * bmp.height))) : 1;
  const bw = Math.round(bmp.width * k), bh = Math.round(bmp.height * k);
  c.width = turned ? bh : bw;
  c.height = turned ? bw : bh;
  const ctx = c.getContext("2d");
  ctx.imageSmoothingQuality = "high";
  ctx.translate(c.width / 2, c.height / 2);
  ctx.rotate(page.rotate * Math.PI / 180);
  ctx.drawImage(bmp, -bw / 2, -bh / 2, bw, bh);
  return c;
}
function rotatePage(page, work){
  const h = work.height;
  const moved = page.corners.map(p => ({x: h - 1 - p.y, y: p.x}));
  page.corners = [moved[3], moved[0], moved[1], moved[2]];
  page.rotate = (page.rotate + 90) % 360;
}
/* The finished page: the quad flattened, filtered, and placed on the paper. */
async function composePage(page, geo){
  const work = await workingCanvas(page);
  const flat = warpQuad(work, page.corners, geo.contentW, geo.contentH);
  applyFilter(flat, page.filter);
  if(geo.contentW === geo.pageW && geo.contentH === geo.pageH) return flat;
  const out = document.createElement("canvas");
  out.width = geo.pageW; out.height = geo.pageH;
  const ctx = out.getContext("2d");
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, out.width, out.height);
  ctx.drawImage(flat, Math.round((geo.pageW - flat.width) / 2), Math.round((geo.pageH - flat.height) / 2));
  return out;
}
/* Paper size in pixels, plus the area the scan may occupy. */
function pageGeometry(page, opts){
  const size = sizeById(opts.sizeId);
  let wMm = size.id === "custom" ? Math.max(5, +opts.customW || 210) : size.w;
  let hMm = size.id === "custom" ? Math.max(5, +opts.customH || 297) : size.h;
  let pageW, pageH;
  if(size.px){ pageW = pageH = size.px; wMm = hMm = size.px / opts.dpi * IN; }
  else {
    let portrait = hMm >= wMm;
    if(opts.orient === "portrait") portrait = true;
    else if(opts.orient === "landscape") portrait = false;
    else if(opts.orient === "auto" && page) portrait = quadAspect(page.corners) <= 1;
    if(portrait !== (hMm >= wMm)){ const t = wMm; wMm = hMm; hMm = t; }
    pageW = mmToPx(wMm, opts.dpi); pageH = mmToPx(hMm, opts.dpi);
  }
  if(size.kind === "photo") return {pageW, pageH, contentW:pageW, contentH:pageH, wMm, hMm, kind:"photo"};
  const m = Math.max(0, Math.min(40, +opts.marginMm || 0));
  const mx = mmToPx(m, opts.dpi);
  const availW = Math.max(16, pageW - mx*2), availH = Math.max(16, pageH - mx*2);
  const aspect = page ? quadAspect(page.corners) : availW / availH;
  let cw = availW, ch = Math.round(availW / aspect);
  if(ch > availH){ ch = availH; cw = Math.round(availH * aspect); }
  return {pageW, pageH, contentW:Math.max(8, cw), contentH:Math.max(8, ch), wMm, hMm, kind:"doc"};
}

async function scanPersist(page){
  await scanDbPut({id:page.id, blob:page.blob, rotate:page.rotate, corners:page.corners, filter:page.filter,
    name:page.name, order:SC.pages.indexOf(page), addedAt:page.addedAt, cap:page.cap || 0});
}
async function scanThumb(page){
  const work = await workingCanvas(page);
  const flat = warpQuad(work, page.corners, 210, Math.max(60, Math.round(210 / Math.max(0.2, quadAspect(page.corners)))));
  applyFilter(flat, page.filter);
  const blob = await canvasToBlob(flat, "image/jpeg", 0.7);
  if(page.thumbUrl) URL.revokeObjectURL(page.thumbUrl);
  page.thumbUrl = URL.createObjectURL(blob);
}
const PAGE_CAP = 16e6;
/* Add one picture as a page. quadHint: corners seen on the live preview, as
   fractions of the frame, used when the photo itself shows no clear page. */
async function scanAddBlob(blob, name, quadHint, hintAspect){
  const page = {id:scanUid(), blob:blob, rotate:0, filter:"doc", addedAt:Date.now(), name:name || "Scan",
    corners:null, cap:PAGE_CAP};
  const work = await workingCanvas(page);
  const hit = quadHint ? findPage(work, 700) : null;
  if(hit && hit.fill > 0.8) page.corners = hit.quad;
  else if(quadHint && Math.abs(work.width / work.height - hintAspect) < 0.03)
    page.corners = quadHint.map(p => ({x:p.x * work.width, y:p.y * work.height}));
  else page.corners = autoCorners(work);
  SC.pages.push(page);
  await scanPersist(page);
  await scanThumb(page);
  return page;
}
async function scanAdd(files){
  const images = files.filter(f => /^image\//.test(f.type));
  if(!images.length){ toast("Those were not pictures"); return; }
  SC.adding = images.length; render();
  for(const f of images){
    const name = (f.name || "").replace(/\.[a-z0-9]+$/i, "").replace(/^(IMG|PXL|DSC)[_-]?/i, "Scan ") || "Scan";
    try { await scanAddBlob(f, name); }
    catch(e){ toast("One picture could not be opened"); }
    SC.adding--; render();
  }
  SC.adding = 0;
  render();
}

/* ======================= live camera, WhatsApp-style =======================
   The camera stays focused on its own; the page's edges are found several
   times a second and drawn over the picture; when the page has held still
   for about a second the photo is taken by itself, at the camera's full
   resolution. Tap the picture to focus on a spot. */
const livePref = {
  get(k, d){ try { const v = localStorage.getItem("kb.live." + k); return v == null ? d : v === "1"; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem("kb.live." + k, v ? "1" : "0"); } catch(e){} }
};
const quadMove = (a, b) => Math.max.apply(null, a.map((p, i) => Math.hypot(p.x - b[i].x, p.y - b[i].y)));

async function openLiveScanner(fallback){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ fallback(); return; }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio:false,
      video:{facingMode:{ideal:"environment"}, width:{ideal:3840}, height:{ideal:2160}}});
  } catch(e){
    toast(e && e.name === "NotAllowedError"
      ? "Camera permission is off for Kitchen Book — opening the camera app instead"
      : "The live camera is not available here — opening the camera app instead");
    fallback();
    return;
  }
  const track = stream.getVideoTracks()[0];
  let caps = {};
  try { caps = (track.getCapabilities && track.getCapabilities()) || {}; } catch(e){}
  const focusModes = caps.focusMode || [];
  const tune = async c => { try { await track.applyConstraints({advanced:[c]}); return true; } catch(e){ return false; } };
  if(focusModes.indexOf("continuous") >= 0) tune({focusMode:"continuous"});

  const NEED = 5;   /* steady readings in a row (~1 s) before an automatic photo */
  const L = {auto:livePref.get("auto", true), torch:false, stable:0, last:null, armed:true, taken:null,
    lost:0, busy:false, count:0, closed:false};

  const video = el("video", {class:"lv-video", autoplay:"autoplay", playsinline:"playsinline"});
  video.muted = true;
  video.srcObject = stream;
  const overlay = el("canvas", {class:"lv-overlay"});
  const ring = el("div", {class:"lv-ring"});
  const flash = el("div", {class:"lv-flash"});
  const hint = el("div", {class:"lv-hint"}, "Starting the camera…");
  const stage = el("div", {class:"lv-stage"}, video, overlay, ring, flash, hint);
  const autoBtn = el("button", {type:"button", class:"lv-chip"});
  const torchBtn = caps.torch ? el("button", {type:"button", class:"lv-chip"}) : null;
  const thumb = el("button", {type:"button", class:"lv-thumb", "aria-label":"Scanned pages", onclick:() => finish()});
  const doneBtn = el("button", {type:"button", class:"lv-done", onclick:() => finish()}, "Done");
  const shutter = el("button", {type:"button", class:"lv-shutter", "aria-label":"Take the photo", onclick:() => capture(L.last)}, el("span"));
  const root = el("div", {class:"lv", role:"dialog", "aria-label":"Scan with the camera"},
    stage,
    el("div", {class:"lv-top"},
      el("button", {type:"button", class:"lv-chip", onclick:() => finish()}, "✕"),
      el("span", {style:"flex:1"}), autoBtn, torchBtn),
    el("div", {class:"lv-bar"}, thumb, shutter, doneBtn));
  const chips = () => {
    autoBtn.textContent = L.auto ? "Auto ✓" : "Auto off";
    autoBtn.classList.toggle("on", L.auto);
    if(torchBtn){ torchBtn.textContent = L.torch ? "Light on" : "Light"; torchBtn.classList.toggle("on", L.torch); }
    doneBtn.textContent = L.count ? "Done · " + L.count : "Done";
  };
  autoBtn.onclick = () => { L.auto = !L.auto; livePref.set("auto", L.auto); L.stable = 0; chips(); };
  if(torchBtn) torchBtn.onclick = async () => { L.torch = !L.torch; if(!(await tune({torch:L.torch}))) L.torch = false; chips(); };
  chips();
  document.body.append(root);
  document.body.classList.add("lv-open");

  /* the phone's Back button closes the scanner instead of leaving the screen */
  try { history.pushState({kbLive:1}, ""); } catch(e){}
  const onPop = () => { if(!L.closed) finish(true); };
  window.addEventListener("popstate", onPop);

  try { await video.play(); } catch(e){}

  /* where the picture actually sits inside the video box (it is letterboxed) */
  const shown = () => {
    const b = stage.getBoundingClientRect(), vw = video.videoWidth || 1, vh = video.videoHeight || 1;
    const s = Math.min(b.width / vw, b.height / vh);
    return {x:(b.width - vw*s) / 2, y:(b.height - vh*s) / 2, w:vw*s, h:vh*s, box:b};
  };
  const draw = q => {
    const b = stage.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    if(overlay.width !== Math.round(b.width * dpr)){ overlay.width = Math.round(b.width * dpr); overlay.height = Math.round(b.height * dpr); }
    const g = overlay.getContext("2d");
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, b.width, b.height);
    if(!q) return;
    const r = shown();
    const ready = Math.min(1, L.stable / NEED);
    g.beginPath();
    q.forEach((p, i) => { const x = r.x + p.x*r.w, y = r.y + p.y*r.h; i ? g.lineTo(x, y) : g.moveTo(x, y); });
    g.closePath();
    g.fillStyle = L.armed ? "rgba(61,214,140," + (0.10 + ready*0.18) + ")" : "rgba(255,255,255,.10)";
    g.fill();
    g.lineWidth = 3;
    g.strokeStyle = L.armed ? (ready >= 1 ? "#3DD68C" : "#FFFFFF") : "rgba(255,255,255,.5)";
    g.stroke();
  };

  const small = document.createElement("canvas");
  const sctx = small.getContext("2d", {willReadFrequently:true});
  const tick = () => {
    if(L.closed || L.busy || !video.videoWidth) return;
    const vw = video.videoWidth, vh = video.videoHeight, f = 360 / Math.max(vw, vh);
    small.width = Math.round(vw * f); small.height = Math.round(vh * f);
    sctx.drawImage(video, 0, 0, small.width, small.height);
    const hit = findPage(small, 360);
    const ok = hit && hit.fill > 0.8 && hit.cover > 0.12 && hit.cover < 0.97;
    const q = ok ? hit.quad.map(p => ({x:p.x / small.width, y:p.y / small.height})) : null;
    L.stable = q && L.last && quadMove(q, L.last) < 0.02 ? L.stable + 1 : 0;
    L.lost = q ? 0 : L.lost + 1;
    L.last = q;
    /* after a photo, wait for the page to change before taking another */
    if(!L.armed && (L.lost >= 3 || (q && L.taken && quadMove(q, L.taken) > 0.1))) L.armed = true;
    draw(q);
    hint.textContent = !q ? "Point at the page — lay it flat with a little table showing round it"
      : !L.armed ? "Got it. Turn to the next page, or tap Done"
      : L.auto ? (L.stable >= NEED - 2 ? "Hold still…" : "Hold steady")
      : "Tap the round button to take it";
    if(q && L.auto && L.armed && L.stable >= NEED) capture(q);
  };
  const timer = setInterval(tick, 200);

  /* tap to focus on a spot, where the camera allows it */
  stage.addEventListener("click", async e => {
    const r = shown();
    const x = (e.clientX - r.box.left - r.x) / r.w, y = (e.clientY - r.box.top - r.y) / r.h;
    if(x < 0 || y < 0 || x > 1 || y > 1) return;
    ring.style.left = (e.clientX - r.box.left) + "px";
    ring.style.top = (e.clientY - r.box.top) + "px";
    ring.classList.remove("go"); void ring.offsetWidth; ring.classList.add("go");
    L.stable = 0;
    if(caps.pointsOfInterest) await tune({pointsOfInterest:[{x:x, y:y}]});
    if(focusModes.indexOf("single-shot") >= 0){
      await tune({focusMode:"single-shot"});
      setTimeout(() => { if(!L.closed && focusModes.indexOf("continuous") >= 0) tune({focusMode:"continuous"}); }, 3000);
    }
  });

  async function capture(q){
    if(L.busy || L.closed) return;
    L.busy = true;
    flash.classList.remove("go"); void flash.offsetWidth; flash.classList.add("go");
    const aspect = (video.videoWidth || 1) / (video.videoHeight || 1);
    let blob = null;
    /* a real photo at the sensor's full size, with its own focus and exposure */
    try {
      if(typeof ImageCapture !== "undefined") blob = await new ImageCapture(track).takePhoto();
    } catch(e){ blob = null; }
    if(!blob){
      const c = document.createElement("canvas");
      c.width = video.videoWidth; c.height = video.videoHeight;
      c.getContext("2d").drawImage(video, 0, 0);
      blob = await canvasToBlob(c, "image/jpeg", 0.95);
    }
    try {
      const page = await scanAddBlob(blob, "Scan " + (SC.pages.length + 1), q, aspect);
      L.count++;
      thumb.style.backgroundImage = "url(" + page.thumbUrl + ")";
      thumb.textContent = String(L.count);
      if(navigator.vibrate) navigator.vibrate(40);
    } catch(e){ toast("That photo could not be saved — try again"); }
    L.taken = q || L.last; L.armed = false; L.stable = 0;
    L.busy = false;
    chips();
  }

  function finish(fromBack){
    if(L.closed) return;
    L.closed = true;
    clearInterval(timer);
    window.removeEventListener("popstate", onPop);
    stream.getTracks().forEach(t => t.stop());
    root.remove();
    document.body.classList.remove("lv-open");
    if(!fromBack){ try { if(history.state && history.state.kbLive) history.back(); } catch(e){} }
    if(L.count){ toast(L.count + " " + pluralise(L.count, "page") + " added"); }
    render();
  }
}

function scanMove(i, dir){
  const j = i + dir;
  if(j < 0 || j >= SC.pages.length) return;
  const t = SC.pages[i]; SC.pages[i] = SC.pages[j]; SC.pages[j] = t;
  SC.pages.forEach(scanPersist);
  render();
}
async function scanRemove(page){
  SC.pages = SC.pages.filter(p => p !== page);
  if(page.thumbUrl) URL.revokeObjectURL(page.thumbUrl);
  await scanDbDel(page.id);
  SC.pages.forEach(scanPersist);
  render();
}
function scanPicker(capture){
  const input = el("input", {type:"file", accept:"image/*", multiple:"multiple", style:"display:none",
    onchange:e => { const files = [...e.target.files]; e.target.value = ""; scanAdd(files); }});
  if(capture) input.setAttribute("capture", "environment");
  return input;
}

/* ---- editor: drag the corners ---- */

        }}, f.label)))),

async function scanSetup(page, canvas, overlay, mag, magCanvas){
  if(!canvas.isConnected) return;
  const work = await workingCanvas(page);
  const maxW = Math.min(canvas.parentNode.clientWidth || 640, 900);
  const maxH = Math.max(260, Math.round(window.innerHeight * 0.55));
  const scale = Math.min(maxW / work.width, maxH / work.height, 1);
  canvas.width = Math.round(work.width * scale);
  canvas.height = Math.round(work.height * scale);
  SC.edit = {page, work, scale, canvas, overlay, mag, magCanvas, handles:[]};
  overlay.textContent = "";
  page.corners.forEach((c, idx) => {
    const h = el("div", {class:"sc-handle", role:"slider", "aria-label":"Corner " + (idx + 1)});
    h.addEventListener("pointerdown", ev => scanDrag(ev, idx, h));
    overlay.append(h);
    SC.edit.handles.push(h);
  });
  scanDraw();
}
function scanDraw(){
  const E = SC.edit;
  if(!E || !E.canvas.isConnected) return;
  const {page, work, scale, canvas, overlay, handles} = E;
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(work, 0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.beginPath();
  page.corners.forEach((c, i) => { const x = c.x * scale, y = c.y * scale; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  ctx.closePath();
  ctx.strokeStyle = "#E7A6D0"; ctx.lineWidth = 2; ctx.setLineDash([7, 5]); ctx.stroke();
  ctx.fillStyle = "rgba(231,166,208,.14)"; ctx.fill();
  ctx.restore();
  const box = canvas.getBoundingClientRect(), obox = overlay.getBoundingClientRect();
  const dx = box.left - obox.left, dy = box.top - obox.top;
  const shown = box.width / canvas.width;
  handles.forEach((h, i) => {
    h.style.left = (dx + page.corners[i].x * scale * shown) + "px";
    h.style.top = (dy + page.corners[i].y * scale * shown) + "px";
  });
}
function scanDrag(ev, idx, handle){
  const E = SC.edit;
  if(!E) return;
  ev.preventDefault();
  handle.setPointerCapture(ev.pointerId);
  const {page, work, scale, canvas, mag, magCanvas} = E;
  mag.style.display = "block";
  const moveTo = e => {
    const box = canvas.getBoundingClientRect();
    const shown = box.width / canvas.width;
    const x = Math.max(0, Math.min(work.width, (e.clientX - box.left) / shown / scale));
    const y = Math.max(0, Math.min(work.height, (e.clientY - box.top) / shown / scale));
    page.corners[idx] = {x, y};
    scanDraw();
    /* A loupe, because a fingertip covers the very corner being placed. */
    const m = magCanvas.getContext("2d");
    const r = Math.max(30, Math.round(Math.min(work.width, work.height) / 12));
    m.fillStyle = "#000"; m.fillRect(0, 0, 104, 104);
    m.drawImage(work, x - r, y - r, r*2, r*2, 0, 0, 104, 104);
    m.strokeStyle = "#E7A6D0"; m.lineWidth = 1.5;
    m.beginPath(); m.moveTo(52, 36); m.lineTo(52, 68); m.moveTo(36, 52); m.lineTo(68, 52); m.stroke();
    const sb = canvas.parentNode.getBoundingClientRect();
    const onLeft = (e.clientX - sb.left) < sb.width / 2;
    mag.style.left = onLeft ? "auto" : "10px";
    mag.style.right = onLeft ? "10px" : "auto";
  };
  moveTo(ev);
  const onUp = async () => {
    handle.removeEventListener("pointermove", moveTo);
    handle.removeEventListener("pointerup", onUp);
    handle.removeEventListener("pointercancel", onUp);
    mag.style.display = "none";
    await scanPersist(page); await scanThumb(page);
  };
  handle.addEventListener("pointermove", moveTo);
  handle.addEventListener("pointerup", onUp);
  handle.addEventListener("pointercancel", onUp);
}

/* A scanned page can go straight into the recipe importer. */
async function scanToRecipe(page){
  const geo = pageGeometry(page, {sizeId:"a4", dpi:150, marginMm:0, orient:"auto"});
  const canvas = await composePage(page, {pageW:geo.contentW, pageH:geo.contentH, contentW:geo.contentW, contentH:geo.contentH});
  const blob = await canvasToBlob(canvas, "image/jpeg", 0.85);
  openFileImport([new File([blob], page.name + ".jpg", {type:"image/jpeg"})]);
}

/* ---- making the file ---- */
const scanFileBase = () => {
  const d = new Date();
  return "scan-" + d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
};
let scanProgressEl = null;
const scanProgress = t => { if(scanProgressEl) scanProgressEl.textContent = t; };
async function scanPdf(opts, limitBytes){
  let budget = limitBytes ? Math.max(24*1024, Math.floor(limitBytes / SC.pages.length)) : 0;
  let blob = null, items = null;
  for(let attempt = 0; attempt < 3; attempt++){
    items = [];
    for(let i = 0; i < SC.pages.length; i++){
      scanProgress("Page " + (i + 1) + " of " + SC.pages.length + (attempt ? " · squeezing" : ""));
      await new Promise(r => setTimeout(r, 0));
      const page = SC.pages[i];
      const geo = pageGeometry(page, opts);
      const canvas = await composePage(page, geo);
      const enc = await encodeUnder(canvas, "image/jpeg", budget);
      items.push({jpeg:new Uint8Array(await enc.blob.arrayBuffer()), pxW:canvas.width, pxH:canvas.height,
        wPt:mmToPt(geo.wMm), hPt:mmToPt(geo.hMm), drawX:0, drawY:0, drawW:mmToPt(geo.wMm), drawH:mmToPt(geo.hMm)});
    }
    blob = buildPdf(items);
    if(!limitBytes || blob.size <= limitBytes) break;
    /* The wrapper costs a little on top of the pictures; aim lower and retry. */
    budget = Math.max(16*1024, Math.floor(budget * (limitBytes / blob.size) * 0.92));
  }
  return {blob, pages:items.length, fits:!limitBytes || blob.size <= limitBytes};
}
async function scanBuild(){
  const o = SC.opts;
  const limitBytes = o.limitKb > 0 ? Math.round(o.limitKb * 1024) : 0;
  const base = (o.filename || scanFileBase()).replace(/[\\/:*?"<>|]+/g, "-").trim() || scanFileBase();
  if(o.format === "pdf"){
    const r = await scanPdf(o, limitBytes);
    return {blob:r.blob, name:base + ".pdf", pages:r.pages, fits:r.fits};
  }
  const page = SC.pages.find(p => p.id === SC.lastOpened) || SC.pages[0];
  scanProgress("Building the picture…");
  await new Promise(r => setTimeout(r, 0));
  const canvas = await composePage(page, pageGeometry(page, o));
  const type = o.format === "png" ? "image/png" : "image/jpeg";
  const enc = await encodeUnder(canvas, type, limitBytes, () => scanProgress("Squeezing…"));
  return {blob:enc.blob, name:base + (type === "image/png" ? ".png" : ".jpg"), pages:1, fits:enc.fits, shrunk:enc.scale < 1};
}

    if(cond){ pass++; out.push("  ok    " + name); }
    else { fail++; out.push("  FAIL  " + name + (got !== undefined ? "   got: " + JSON.stringify(got) : "")); }
  };

  out.push("UNIT CONVERSION");
  check("1 kg is 1000 g", near(convert(1,"kg","g").value, 1000), convert(1,"kg","g"));
