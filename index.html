<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6E2E58">
<meta name="description" content="Recipes costed from your own supplier prices.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Kitchen Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#EFEFEC; --card:#FCFCFA; --sunk:#E7E7E2;
  --ink:#1C1B1E; --ink-2:#4A4750; --muted:#6E6B72; --faint:#918D97;
  --line:#DBDAD5; --line-2:#C7C5BF;
  --accent:#6E2E58; --accent-ink:#FFFFFF; --accent-soft:#F3E9F0; --accent-line:#D9BFD0;
  --brass:#9A7433;
  --good:#2F6A4B; --good-soft:#E6F0E9;
  --warn:#8A6011; --warn-soft:#F6EEDD;
  --bad:#A3311F; --bad-soft:#F7E7E3;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Karla","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:6px; --rail:224px;
  --shadow:0 1px 2px rgba(28,27,30,.05), 0 8px 24px -16px rgba(28,27,30,.28);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#171619; --card:#201F24; --sunk:#131215;
    --ink:#EDEAEF; --ink-2:#C4BFC9; --muted:#9A95A1; --faint:#7B7682;
    --line:#332F39; --line-2:#443F4B;
    --accent:#C98BB4; --accent-ink:#241426; --accent-soft:#2B2131; --accent-line:#4A3A4A;
    --brass:#C9A45E;
    --good:#7FC49C; --good-soft:#1E2B24;
    --warn:#D8AC5A; --warn-soft:#2C2519;
    --bad:#E58E7C; --bad-soft:#2E1D1A;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --paper:#171619; --card:#201F24; --sunk:#131215;
  --ink:#EDEAEF; --ink-2:#C4BFC9; --muted:#9A95A1; --faint:#7B7682;
  --line:#332F39; --line-2:#443F4B;
  --accent:#C98BB4; --accent-ink:#241426; --accent-soft:#2B2131; --accent-line:#4A3A4A;
  --brass:#C9A45E;
  --good:#7FC49C; --good-soft:#1E2B24;
  --warn:#D8AC5A; --warn-soft:#2C2519;
  --bad:#E58E7C; --bad-soft:#2E1D1A;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html{color-scheme:light dark}
img{max-width:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100vh}
.rail{border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px;background:var(--card)}
.mark{display:flex;gap:10px;align-items:baseline;padding:0 8px}
.mark b{font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:-.02em}
.mark span{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r);color:var(--ink-2);text-decoration:none;font-weight:500;font-size:14px}
.nav a:hover{background:var(--sunk);color:var(--ink)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav a svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nav .count{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint)}
.railfoot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 8px}
.storepill{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);flex:none}
.dot.local{background:var(--warn)}
main{min-width:0;padding:26px 30px 90px;max-width:1120px}
.topbar{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:20px}
.topbar h1{font-size:27px}
.topbar .sub{color:var(--muted);font-size:13.5px;margin-top:3px}
.topbar .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint)}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border:1px solid var(--line-2);background:var(--card);border-radius:var(--r);cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.btn:hover{border-color:var(--ink-2);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--sunk);color:var(--ink)}
.btn.danger{color:var(--bad);border-color:var(--line-2)}
.btn.danger:hover{border-color:var(--bad);background:var(--bad-soft)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
input[type=text],input[type=number],input[type=search],input[type=date],select,textarea{width:100%;padding:7px 10px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--card)}
input[type=number]{font-family:var(--mono)}
textarea{min-height:88px;resize:vertical;line-height:1.55}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.01em}
label.f>input,label.f>select,label.f>textarea{font-weight:400;color:var(--ink);letter-spacing:0}
.row{display:flex;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.hint{font-size:12px;color:var(--faint);line-height:1.45}

/* ---------- sheet (the ruled table) ---------- */
.sheet{width:100%;border-collapse:collapse;font-size:14px}
.sheet th{text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:500;padding:0 10px 7px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.sheet td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.sheet tbody tr:hover td{background:var(--card)}
.sheet .num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.sheet .thin{color:var(--muted);font-size:13px}
.wrap{overflow-x:auto}
.name{font-weight:600}
.sub2{color:var(--muted);font-size:12.5px}

/* ---------- pills & chips ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;font-family:var(--mono);letter-spacing:.02em;border:1px solid transparent}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.flat{background:var(--sunk);color:var(--muted)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.tag{display:inline-block;padding:1px 7px;border:1px solid var(--line-2);border-radius:999px;font-size:11.5px;color:var(--muted)}
.tags{display:flex;gap:5px;flex-wrap:wrap}

/* ---------- panels ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel>h3{font-size:16px;margin-bottom:10px}
.costcard{background:var(--card);border:1px solid var(--accent-line);border-top:3px solid var(--accent);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.costcard .big{font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dotted var(--line-2);font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500}
.empty{border:1px dashed var(--line-2);border-radius:var(--r);padding:26px;text-align:center;color:var(--muted)}
.empty h3{font-size:17px;color:var(--ink);margin-bottom:5px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
.stack{display:flex;flex-direction:column;gap:18px}
.sec{display:flex;align-items:center;gap:10px;margin:4px 0 10px}
.sec h2{font-size:18px}
.sec .line{flex:1;height:1px;background:var(--line)}
.banner{display:flex;gap:11px;align-items:flex-start;padding:11px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);font-size:13.5px;border:1px solid transparent;margin-bottom:18px}
.banner.acc{background:var(--accent-soft);color:var(--accent)}
.banner .btn{background:transparent}

/* ---------- cards ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:14px}
.rcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;width:100%;font-family:var(--body)}
.rcard:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.rcard h3{font-size:17px;line-height:1.25}
.rcard .foot{margin-top:auto;display:flex;align-items:baseline;gap:8px;padding-top:6px;border-top:1px dotted var(--line-2)}
.rcard .cost{font-family:var(--mono);font-weight:600;font-size:15px;margin-left:auto;font-variant-numeric:tabular-nums}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,18,22,.5);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow:auto;z-index:50}
.modal{background:var(--paper);border:1px solid var(--line-2);border-radius:8px;width:100%;max-width:620px;box-shadow:0 24px 60px -20px rgba(0,0,0,.5)}
.modal.wide{max-width:860px}
.modal header{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line)}
.modal header h2{font-size:19px}
.modal .mbody{padding:18px;display:flex;flex-direction:column;gap:14px}
.modal footer{display:flex;gap:8px;justify-content:flex-end;padding:13px 18px;border-top:1px solid var(--line);background:var(--card);border-radius:0 0 8px 8px}
.x{margin-left:auto}

/* ---------- misc ---------- */
.lines{display:flex;flex-direction:column;gap:7px}
.lineRow{display:grid;grid-template-columns:minmax(0,1fr) 74px 92px 66px 30px;gap:7px;align-items:center}
.lineRow .del{border:0;background:transparent;color:var(--faint);cursor:pointer;font-size:17px;line-height:1}
.lineRow .del:hover{color:var(--bad)}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:12px;padding:0;margin:0;list-style:none}
.steps li{counter-increment:s;display:grid;grid-template-columns:26px 1fr;gap:12px;line-height:1.6}
.steps li::before{content:counter(s);font-family:var(--mono);font-size:12px;color:var(--accent);border:1px solid var(--accent-line);border-radius:50%;width:24px;height:24px;display:grid;place-items:center;margin-top:1px}
.feeditem{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.feeditem:last-child{border-bottom:0}
.feeditem .fbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.feeditem h3{font-size:16.5px}
.thinking{display:inline-flex;gap:6px;align-items:center;color:var(--muted);font-size:13px}
.thinking i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 1.1s ease-in-out infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:500;z-index:300;box-shadow:var(--shadow)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.split>*,.stack{min-width:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:6px 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--card);color:var(--ink-2);cursor:pointer;font-size:13px;font-weight:600;font-family:var(--body)}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.searchbox{position:relative;max-width:360px;margin-bottom:16px}
.searchbox .ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.searchbox svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.searchbox input{padding-left:34px}
.sc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.sc-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.sc-thumb{aspect-ratio:3/4;background:var(--sunk);display:grid;place-items:center;cursor:pointer;position:relative;border:0;padding:6px;width:100%}
.sc-thumb img{width:100%;height:100%;object-fit:contain;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.sc-num{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.62);color:#fff;font-family:var(--mono);font-size:11px;padding:1px 7px;border-radius:999px}
.sc-name{font-weight:600;font-size:13px;padding:8px 10px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-date{font-family:var(--mono);font-size:11px;color:var(--faint);padding:0 10px 6px}
.sc-tools{display:flex;gap:2px;padding:4px;border-top:1px solid var(--line)}
.sc-tools button{flex:1;background:transparent;border:0;color:var(--muted);padding:7px 2px;border-radius:5px;cursor:pointer;font-size:12.5px;font-weight:600}
.sc-tools button:hover:not([disabled]){background:var(--sunk);color:var(--ink)}
.sc-tools button[disabled]{opacity:.35;cursor:default}
.sc-stage{position:relative;background:#141316;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;touch-action:none;display:grid;place-items:center;min-height:300px}
.sc-stage canvas{display:block;max-width:100%;touch-action:none}
.sc-overlay{position:absolute;inset:0}
.sc-handle{position:absolute;width:32px;height:32px;margin:-16px 0 0 -16px;border-radius:50%;border:2px solid #E7A6D0;background:rgba(231,166,208,.25);cursor:grab;touch-action:none}
.sc-handle:active{cursor:grabbing;background:rgba(231,166,208,.45)}
.sc-mag{position:absolute;top:10px;width:104px;height:104px;border-radius:50%;border:2px solid #E7A6D0;overflow:hidden;pointer-events:none;background:#000;display:none;z-index:5}
.sc-mag canvas{width:100%;height:100%}
/* live scanner */
body.lv-open{overflow:hidden}
body.lv-open .toast{bottom:calc(120px + env(safe-area-inset-bottom))}
.lv{position:fixed;inset:0;z-index:200;background:#000;color:#fff;display:flex;flex-direction:column;font-family:var(--body)}
.lv-stage{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:manipulation}
.lv-video,.lv-overlay{position:absolute;inset:0;width:100%;height:100%}
.lv-video{object-fit:contain;background:#000}
.lv-overlay{pointer-events:none}
.lv-hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(0,0,0,.62);padding:7px 14px;border-radius:999px;font-size:13.5px;font-weight:600;max-width:92%;text-align:center;pointer-events:none}
.lv-top{position:absolute;top:0;left:0;right:0;display:flex;gap:8px;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:linear-gradient(rgba(0,0,0,.55),transparent)}
.lv-chip{border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.45);color:#fff;border-radius:999px;padding:7px 13px;font:600 13px var(--body);cursor:pointer}
.lv-chip.on{background:#fff;color:#111;border-color:#fff}
.lv-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 22px calc(18px + env(safe-area-inset-bottom));background:#000}
.lv-shutter{width:74px;height:74px;border-radius:50%;border:4px solid #fff;background:transparent;padding:5px;cursor:pointer;flex:none}
.lv-shutter span{display:block;width:100%;height:100%;border-radius:50%;background:#fff}
.lv-shutter:active span{transform:scale(.9)}
.lv-thumb{width:52px;height:52px;border-radius:8px;border:2px solid rgba(255,255,255,.7);background:#222 center/cover no-repeat;color:#fff;font:700 13px var(--mono);cursor:pointer;flex:none;text-shadow:0 1px 3px #000}
.lv-done{min-width:74px;border:0;border-radius:999px;background:#fff;color:#111;padding:10px 16px;font:700 14px var(--body);cursor:pointer}
.lv-ring{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border:2px solid #FFD54A;border-radius:50%;opacity:0;pointer-events:none}
.lv-ring.go{animation:lvring .9s ease-out}
@keyframes lvring{0%{opacity:1;transform:scale(1.5)}60%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
.lv-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.lv-flash.go{animation:lvflash .35s ease-out}
@keyframes lvflash{0%{opacity:.85}100%{opacity:0}}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font:inherit;text-decoration:underline;cursor:pointer}
.ico{display:inline-flex;align-items:center;flex:none}
code{font-family:var(--mono);font-size:12.5px;background:var(--sunk);padding:1px 5px;border-radius:4px}
details summary::-webkit-details-marker{color:var(--faint)}
.keyrow{display:flex;gap:8px;align-items:flex-end}
.keyrow label.f{flex:1}
.right{text-align:right}
.mobnav{display:none}
#testout{font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;padding:16px;line-height:1.65}

@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .rail{display:none}
  main{padding:18px 15px 96px}
  .split{grid-template-columns:1fr}
  .grid2,.grid3{grid-template-columns:1fr}
  .lineRow{grid-template-columns:1fr 1fr 30px;padding-bottom:9px;border-bottom:1px dotted var(--line-2)}
  .lineRow>input:first-child{grid-column:1 / -1}
  .col-waste,.col-cat{display:none}
  .lineRow .waste{display:none}
  .mobnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:40}
  .mobnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;color:var(--muted);text-decoration:none;font-size:10.5px;font-weight:600}
  .mobnav a.on{color:var(--accent)}
  .mobnav svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .topbar h1{font-size:23px}
  .sc-grid{grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
  .mobnav a{font-size:10px}
}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
"use strict";

/* ======================= units & money ======================= */
const UNITS = {
  g:{f:1,fam:"mass",label:"g"},   kg:{f:1000,fam:"mass",label:"kg"},
  oz:{f:28.349523125,fam:"mass",label:"oz"}, lb:{f:453.59237,fam:"mass",label:"lb"},
  ml:{f:1,fam:"vol",label:"ml"},  l:{f:1000,fam:"vol",label:"l"},
  tsp:{f:4.92892159375,fam:"vol",label:"tsp"}, tbsp:{f:14.78676478125,fam:"vol",label:"tbsp"},
  cup:{f:236.5882365,fam:"vol",label:"cup"},   floz:{f:29.5735295625,fam:"vol",label:"fl oz"},
  each:{f:1,fam:"count",label:"each"}, dozen:{f:12,fam:"count",label:"dozen"}
};
const UNIT_KEYS  = Object.keys(UNITS);
const BASE_UNITS = ["g","ml","each"];
const SHOW_PER   = {g:{unit:"kg",mult:1000}, ml:{unit:"l",mult:1000}, each:{unit:"each",mult:1}};

function num(v){ const n = typeof v === "number" ? v : parseFloat(v); return isFinite(n) ? n : NaN; }

/* Convert a quantity between units. Cross-family conversion needs the
   density (g per ml) or piece weight (g per each) stored on the ingredient
   — without it we refuse rather than guess. */
function convert(qty, from, to, ing){
  const F = UNITS[from], T = UNITS[to];
  if(!F || !T) return {ok:false, reason:"unknown unit"};
  const q = num(qty);
  if(!isFinite(q)) return {ok:false, reason:"no quantity"};
  if(F.fam === T.fam) return {ok:true, value: q*F.f/T.f};
  const dens = ing && num(ing.densityGPerMl) > 0 ? num(ing.densityGPerMl) : null;
  const each = ing && num(ing.gramsPerEach)  > 0 ? num(ing.gramsPerEach)  : null;
  let grams;
  if(F.fam === "mass") grams = q*F.f;
  else if(F.fam === "vol"){ if(!dens) return {ok:false, reason:"needs a density (g per ml)"}; grams = q*F.f*dens; }
  else { if(!each) return {ok:false, reason:"needs a weight per piece"}; grams = q*F.f*each; }
  if(T.fam === "mass") return {ok:true, value: grams/T.f};
  if(T.fam === "vol"){ if(!dens) return {ok:false, reason:"needs a density (g per ml)"}; return {ok:true, value: grams/dens/T.f}; }
  if(!each) return {ok:false, reason:"needs a weight per piece"};
  return {ok:true, value: grams/each/T.f};
}

/* Cost of one base unit (per g / per ml / per each) from a stored pack price. */
function unitCostOf(price, ing){
  const base = (ing && ing.baseUnit) || "g";
  const conv = convert(price.packQty, price.packUnit, base, ing);
  const paid = num(price.packPrice);
  if(!conv.ok) return {ok:false, reason:conv.reason};
  if(!isFinite(paid) || !(conv.value > 0)) return {ok:false, reason:"pack size or price missing"};
  return {ok:true, value: paid/conv.value, base:base};
}

const STALE_DAYS = 90;
function daysSince(iso){
  if(!iso) return null;
  const t = Date.parse(iso);
  if(!isFinite(t)) return null;
  return Math.floor((Date.now()-t)/86400000);
}

/* A quote as it stood on a given day: the current one if it was already in
   force, otherwise the newest older quote kept in the price's history.
   No date means "now". */
function quoteAsOf(price, asOf){
  if(!asOf) return price;
  const all = [price].concat(price.history || []).filter(q => q && q.date && q.date <= asOf);
  if(!all.length) return null;
  all.sort((a,b) => (a.date < b.date) - (a.date > b.date));
  return all[0];
}

/* Every stored price for an ingredient, normalised and ranked cheapest first.
   Pass a date to see them as they stood then. */
function pricesFor(ingId, asOf){
  const ing = S.ix.ing[ingId];
  const rows = [];
  S.prices.forEach(p => {
    /* A price whose supplier was deleted is never used for costing. */
    if(p.ingredientId !== ingId || !S.ix.sup[p.supplierId]) return;
    const q = quoteAsOf(p, asOf);
    if(!q) return;
    const uc  = unitCostOf(q, ing);
    const age = daysSince(q.date);
    rows.push({
      price:p, quote:q, supplier:S.ix.sup[p.supplierId], ok:uc.ok, reason:uc.reason,
      unitCost: uc.ok ? uc.value : null, age:age, stale: !asOf && age != null && age > STALE_DAYS
    });
  });
  rows.sort((a,b) => (a.ok ? a.unitCost : Infinity) - (b.ok ? b.unitCost : Infinity));
  return rows;
}

/* The price we actually cost with: pinned supplier if set, otherwise cheapest. */
function bestPriceFor(ingId, asOf){
  const rows = pricesFor(ingId, asOf).filter(r => r.ok);
  if(!rows.length) return null;
  const ing = S.ix.ing[ingId];
  if(ing && ing.defaultSupplierId){
    const pinned = rows.find(r => r.price.supplierId === ing.defaultSupplierId);
    if(pinned) return Object.assign({pinned:true}, pinned);
  }
  return rows[0];
}

/* ======================= recipe costing ======================= */
function costRecipe(recipe, scale, asOf){
  const mult = num(scale) > 0 ? num(scale) : 1;
  const set  = S.settings;
  const lines = (recipe.lines || []).map(line => {
    const ing = line.ingredientId ? S.ix.ing[line.ingredientId] : null;
    const qty = num(line.qty) * mult;
    const out = {line:line, ing:ing, qty:qty, cost:null, problem:null, source:null};
    if(!ing){ out.problem = "not linked to an ingredient"; return out; }
    const best = bestPriceFor(ing.id, asOf);
    if(!best){ out.problem = "no supplier price yet"; return out; }
    const conv = convert(qty, line.unit, ing.baseUnit, ing);
    if(!conv.ok){ out.problem = conv.reason; return out; }
    const waste = Math.min(95, Math.max(0, num(line.wastePct) || 0));
    out.baseQty = conv.value / (1 - waste/100);
    out.cost    = out.baseQty * best.unitCost;
    out.source  = best;
    out.stale   = best.stale;
    return out;
  });
  const counted    = lines.filter(l => l.cost != null);
  const ingredCost = counted.reduce((s,l) => s + l.cost, 0);
  const b          = recipe.business || {};
  const labourMin  = num(b.labourMin) || 0;
  const labour     = labourMin/60 * (num(set.labourPerHour) || 0) * mult;
  const overhead   = ingredCost * ((num(set.overheadPct) || 0)/100);
  const total      = ingredCost + labour + overhead;
  const servings   = Math.max(0.0001, (num(recipe.servings) || 1) * mult);
  const targetPct  = num(b.targetFoodCostPct) || num(set.targetFoodCostPct) || 0;
  const sell       = num(b.sellingPrice) || 0;
  return {
    lines:lines, ingredCost:ingredCost, labour:labour, overhead:overhead, total:total,
    unpriced: lines.length - counted.length,
    perServing: total/servings, servings:servings,
    hasStale: counted.some(l => l.stale),
    targetPct: targetPct,
    /* Selling price is entered per serving, so every comparison is per serving. */
    suggestedPrice: targetPct > 0 ? (total/servings)/(targetPct/100) : null,
    sellingPrice: sell || null,
    foodCostPct: sell > 0 ? ((total/servings)/sell)*100 : null,
    margin: sell > 0 ? sell - total/servings : null
  };
}

/* Who to buy from, for a set of {ingredientId, baseQty} needs. */
function sourcingPlan(needs){
  const perItem = needs.map(n => {
    const rows = pricesFor(n.ingredientId).filter(r => r.ok);
    /* Same choice the recipe costing makes: a pinned supplier wins, else cheapest. */
    const best = bestPriceFor(n.ingredientId);
    return Object.assign({}, n, {
      ing:S.ix.ing[n.ingredientId], options:rows, best: best,
      cost: best ? best.unitCost*n.baseQty : null
    });
  });
  const splitTotal = perItem.reduce((s,i) => s + (i.cost || 0), 0);
  const supIds = new Set();
  perItem.forEach(i => i.options.forEach(o => supIds.add(o.price.supplierId)));
  const baskets = [...supIds].map(sid => {
    const sup = S.ix.sup[sid];
    let total = 0; const covered = [], missing = [];
    perItem.forEach(i => {
      const opt = i.options.find(o => o.price.supplierId === sid);
      if(opt){ total += opt.unitCost*i.baseQty; covered.push(i); } else missing.push(i);
    });
    const minOrder = num(sup && sup.minOrder) || 0;
    return {
      supplier:sup, total:total, covered:covered, missing:missing,
      belowMin: minOrder > 0 && total < minOrder, minOrder:minOrder,
      delivery: num(sup && sup.deliveryFee) || 0
    };
  }).sort((a,b) => (a.missing.length - b.missing.length) || (a.total - b.total));
  return {perItem:perItem, splitTotal:splitTotal, baskets:baskets, unpriced: perItem.filter(i => !i.best)};
}

/* ======================= price history, pantry, orders ======================= */
const TREND_DAYS = 30;
function daysAgoISO(n){ return todayISO(new Date(Date.now() - n*86400000)); }

/* What you pay for an ingredient now against a month ago, as a % change. */
function ingredientTrend(ingId){
  const now = bestPriceFor(ingId), then = bestPriceFor(ingId, daysAgoISO(TREND_DAYS));
  if(!now || !then || !(then.unitCost > 0)) return null;
  return (now.unitCost - then.unitCost) / then.unitCost * 100;
}

/* Recipes whose cost per serving moved by at least the alert threshold this
   month. Only fully costed recipes are compared, so a line that has just been
   priced for the first time never looks like a price rise. */
function costAlerts(){
  const limit = num(S.settings.alertPct) > 0 ? num(S.settings.alertPct) : 10;
  const then = daysAgoISO(TREND_DAYS);
  return S.recipes.map(r => {
    const a = costRecipe(r, 1, then), b = costRecipe(r, 1);
    if(!a.lines.length || a.unpriced || b.unpriced || !(a.perServing > 0)) return null;
    const change = (b.perServing - a.perServing) / a.perServing * 100;
    return Math.abs(change) >= limit ? {recipe:r, before:a.perServing, after:b.perServing, change:change} : null;
  }).filter(Boolean).sort((x, y) => Math.abs(y.change) - Math.abs(x.change));
}
function trendPill(pct){
  if(pct == null || Math.abs(pct) < 0.5) return null;
  const up = pct > 0;
  return el("span", {class:"pill " + (up ? "bad" : "good"), title:"Change over the last " + TREND_DAYS + " days"},
    (up ? "↑ " : "↓ ") + Math.abs(pct).toFixed(Math.abs(pct) < 10 ? 1 : 0) + "%");
}

/* Stock lives on the ingredient, in its base unit (g, ml or each). */
function stockOf(ingId){ const i = S.ix.ing[ingId]; return i && num(i.stock) > 0 ? num(i.stock) : 0; }
function hasStock(){ return S.ingredients.some(i => num(i.stock) > 0); }

/* What a recipe needs of each linked ingredient, in base units, waste included. */
function recipeNeeds(r, scale){
  const mult = num(scale) > 0 ? num(scale) : 1;
  const need = {}; let unknown = 0;
  (r.lines || []).forEach(l => {
    const ing = l.ingredientId ? S.ix.ing[l.ingredientId] : null;
    const conv = ing ? convert(num(l.qty) * mult, l.unit, ing.baseUnit, ing) : {ok:false};
    if(!conv.ok){ unknown++; return; }
    const waste = Math.min(95, Math.max(0, num(l.wastePct) || 0));
    need[ing.id] = (need[ing.id] || 0) + conv.value / (1 - waste/100);
  });
  return {need:need, unknown:unknown};
}
/* How far a recipe is from cookable with what is in stock. */
function recipeShortfall(r){
  const n = recipeNeeds(r, 1);
  let missing = 0, cost = 0;
  Object.keys(n.need).forEach(id => {
    const short = n.need[id] - stockOf(id);
    if(short > 1e-6){ missing++; const b = bestPriceFor(id); if(b) cost += short * b.unitCost; }
  });
  return {missing:missing, cost:cost, unknown:n.unknown};
}

/* Round a need up to whole packs of the quote it is bought at. */
function packsFor(item){
  if(!item.best || !item.ing) return null;
  const q = item.best.price;
  const pack = convert(q.packQty, q.packUnit, item.ing.baseUnit, item.ing);
  if(!pack.ok || !(pack.value > 0)) return null;
  const packs = Math.max(1, Math.ceil(item.baseQty / pack.value - 1e-9));
  return {
    packs:packs, packPrice:num(q.packPrice), cost:packs * num(q.packPrice),
    label: q.packLabel || (qtyText(num(q.packQty)) + " " + unitLabel(q.packUnit)),
    left: packs * pack.value - item.baseQty, sku: q.sku || ""
  };
}

/* The next day a supplier can deliver, allowing for their lead time. */
const WEEKDAYS = ["sun","mon","tue","wed","thu","fri","sat"];
function nextDelivery(sup){
  const days = (sup.deliveryDays || []).map(d => WEEKDAYS.indexOf(String(d).trim().slice(0,3).toLowerCase())).filter(i => i >= 0);
  const lead = Math.max(1, num(sup.leadTimeDays) || 1);
  for(let k = lead; k < lead + 14; k++){
    const d = new Date(Date.now() + k*86400000);
    if(!days.length || days.indexOf(d.getDay()) >= 0) return d;
  }
  return null;
}

/* One order per supplier from a sourcing plan, in whole packs. */
function buildOrders(plan){
  const by = {};
  plan.perItem.forEach(i => {
    if(!i.best) return;
    const p = packsFor(i);
    if(!p) return;
    const sid = i.best.price.supplierId;
    (by[sid] = by[sid] || []).push(Object.assign({item:i}, p));
  });
  return Object.keys(by).map(sid => {
    const sup = S.ix.sup[sid];
    const lines = by[sid].sort((a, b) => ((a.item.ing && a.item.ing.name) || "").localeCompare((b.item.ing && b.item.ing.name) || ""));
    const total = lines.reduce((s, l) => s + l.cost, 0);
    const when = nextDelivery(sup);
    const minOrder = num(sup.minOrder) || 0;
    return {supplier:sup, lines:lines, total:total, when:when, minOrder:minOrder,
      belowMin: minOrder > 0 && total < minOrder, text: orderText(sup, lines, when)};
  }).sort((a, b) => b.total - a.total);
}
function orderText(sup, lines, when){
  const whenText = when ? " for delivery on " + when.toLocaleDateString(undefined, {weekday:"long", day:"numeric", month:"long"}) : "";
  const name = String(S.settings.orderName || "").trim();
  return "Hello " + sup.name + ", please could I order the following" + whenText + ":\n\n" +
    lines.map(l => "• " + l.packs + " × " + l.label + " — " + ((l.item.ing && l.item.ing.name) || "") +
      (l.sku ? " (code " + l.sku + ")" : "")).join("\n") +
    "\n\nThank you" + (name ? ",\n" + name : ".");
}

/* Save a price. When the amount or pack changes on a later day, the old quote
   goes into the price's history, so trends and alerts have something to
   compare against. A same-day change is a correction and just overwrites. */
async function savePrice(existing, next){
  const body = Object.assign({}, next);
  delete body.id;
  let history = ((existing && existing.history) || []).slice();
  if(existing){
    const changed = num(existing.packPrice) !== num(next.packPrice) ||
      num(existing.packQty) !== num(next.packQty) || existing.packUnit !== next.packUnit;
    if(changed && existing.date && existing.date !== todayISO()){
      history.unshift({date:existing.date, packQty:existing.packQty, packUnit:existing.packUnit, packPrice:existing.packPrice});
      history = history.slice(0, 24);
      if(!body.date || body.date === existing.date) body.date = todayISO();
    }
  }
  body.history = history;
  return Store.save("prices", existing ? existing.id : null, body);
}

/* ======================= storage ======================= */
const LS = "kitchenbook.v1.";
function uid(){ return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,8); }
function todayISO(d){
  const x = d || new Date();
  return x.getFullYear() + "-" + String(x.getMonth()+1).padStart(2,"0") + "-" + String(x.getDate()).padStart(2,"0");
}

const Store = {
  mode:"local", db:null, subs:{},
  async init(){
    /* Installed app: everything lives on this device. Moving a book between
       devices is a deliberate act — Settings, download a backup, restore. */
    this.db = null;
    this.mode = "local";
    return this.mode;
  },
  _mem:{}, _lsOk:null,
  _lsAvailable(){
    if(this._lsOk != null) return this._lsOk;
    try { localStorage.setItem(LS+"probe", "1"); localStorage.removeItem(LS+"probe"); this._lsOk = true; }
    catch(e){ this._lsOk = false; }
    return this._lsOk;
  },
  _local(coll){
    if(!this._lsAvailable()) return this._mem[coll] || {};
    try { return JSON.parse(localStorage.getItem(LS+coll) || "{}"); } catch(e){ return {}; }
  },
  _localSet(coll, obj){
    if(!this._lsAvailable()){ this._mem[coll] = obj; return; }
    try { localStorage.setItem(LS+coll, JSON.stringify(obj)); } catch(e){ toast("Browser storage is full"); }
  },
  _fire(coll){ (this.subs[coll] || []).forEach(fn => fn()); },
  watch(coll, cb){
    if(this.mode === "cloud"){
      return this.db.collection(coll).onSnapshot(
        snap => cb(snap.docs.map(d => Object.assign({id:d.id}, d.data()))),
        err  => { console.warn("db " + coll, err); if(err.code !== "revoked") toast("Storage trouble: " + err.code); }
      );
    }
    const emit = () => cb(Object.entries(this._local(coll)).map(function(e){ return Object.assign({id:e[0]}, e[1]); }));
    (this.subs[coll] = this.subs[coll] || []).push(emit);
    emit();
    return () => { this.subs[coll] = (this.subs[coll] || []).filter(f => f !== emit); };
  },
  async save(coll, id, data){
    const docId = id || uid();
    const body  = Object.assign({}, data);
    delete body.id;
    if(this.mode === "cloud") await this.db.doc(coll + "/" + docId).set(body);
    else { const all = this._local(coll); all[docId] = body; this._localSet(coll, all); this._fire(coll); }
    return docId;
  },
  async remove(coll, id){
    if(this.mode === "cloud") await this.db.doc(coll + "/" + id).delete();
    else { const all = this._local(coll); delete all[id]; this._localSet(coll, all); this._fire(coll); }
  }
};

/* ======================= formatting ======================= */
function money(n, dp){
  if(n == null || !isFinite(n)) return "—";
  const d = dp == null ? 2 : dp;
  const neg = n < 0;
  return (neg ? "-" : "") + (S.settings.symbol || "") +
    Math.abs(n).toLocaleString("en-US", {minimumFractionDigits:d, maximumFractionDigits:d});
}
function qtyText(n){
  if(n == null || !isFinite(n)) return "—";
  const a = Math.abs(n);
  const d = a >= 100 ? 0 : a >= 10 ? 1 : a >= 1 ? 2 : 3;
  return String(parseFloat(n.toFixed(d)));
}
function unitLabel(u){ return UNITS[u] ? UNITS[u].label : u; }
/* Per-gram numbers are unreadable — show per kg / per l / each instead. */
function perUnitText(unitCost, baseUnit){
  if(unitCost == null || !isFinite(unitCost)) return "—";
  const show = SHOW_PER[baseUnit] || SHOW_PER.g;
  const v = unitCost * show.mult;
  return money(v, v < 1 ? 3 : 2) + " / " + show.unit;
}
function pluralise(n, one, many){ return n === 1 ? one : (many || one + "s"); }
/* Only ever link to web pages. A bare domain ("metro.com") gets https:// added;
   anything else — javascript:, data: — is shown as plain text instead. */
function safeUrl(u){
  const s = String(u || "").trim();
  if(/^https?:\/\/\S+$/i.test(s)) return s;
  if(/^[a-z0-9-]+(\.[a-z0-9-]+)+(\/\S*)?$/i.test(s)) return "https://" + s;
  return null;
}

/* ======================= tiny DOM helper ======================= */
function el(tag, props){
  const n = document.createElement(tag);
  if(props) for(const k in props){
    const v = props[k];
    if(v == null || v === false) continue;
    if(k === "class") n.className = v;
    else if(k === "html") n.innerHTML = v;
    else if(k === "value") n.value = v;
    else if(k === "checked" || k === "disabled" || k === "selected" || k === "open") n[k] = !!v;
    else if(k.slice(0,2) === "on" && typeof v === "function") n.addEventListener(k.slice(2).toLowerCase(), v);
    else n.setAttribute(k, v);
  }
  for(let i = 2; i < arguments.length; i++) append(n, arguments[i]);
  return n;
}
function append(parent, kid){
  if(kid == null || kid === false || kid === true) return;
  if(Array.isArray(kid)){ kid.forEach(k => append(parent, k)); return; }
  parent.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
}
function frag(){ const f = document.createDocumentFragment(); for(let i = 0; i < arguments.length; i++) append(f, arguments[i]); return f; }

  return q.split(/\s+/).every(word => hay.indexOf(word) >= 0);
}

function niceDate(iso){
  const t = Date.parse(iso + "T12:00:00");
  if(!isFinite(t)) return iso;
  const d = new Date(t);
  const today = todayISO();
  if(iso === today) return "Today";
  const y = new Date(Date.now() - 86400000);
  if(iso === todayISO(y)) return "Yesterday";
  return d.toLocaleDateString(undefined, {weekday:"long", month:"short", day:"numeric"});

const UNIT_ALIASES = {
  g:"g", gram:"g", grams:"g", gr:"g", kg:"kg", kilo:"kg", kilos:"kg", kilogram:"kg", kilograms:"kg",
  ml:"ml", millilitre:"ml", milliliter:"ml", millilitres:"ml", milliliters:"ml",
  l:"l", litre:"l", liter:"l", litres:"l", liters:"l",
  tsp:"tsp", teaspoon:"tsp", teaspoons:"tsp", tsps:"tsp",
  tbsp:"tbsp", tablespoon:"tbsp", tablespoons:"tbsp", tbsps:"tbsp",
  cup:"cup", cups:"cup", oz:"oz", ounce:"oz", ounces:"oz",
  lb:"lb", lbs:"lb", pound:"lb", pounds:"lb",
  each:"each", piece:"each", pieces:"each", pc:"each", pcs:"each", clove:"each", cloves:"each",
  dozen:"dozen"
};
function parseFraction(s){
  const t = s.trim();
  if(/^\d+\s+\d+\/\d+$/.test(t)){ const p = t.split(/\s+/); const f = p[1].split("/"); return parseFloat(p[0]) + parseFloat(f[0])/parseFloat(f[1]); }
  if(/^\d+\/\d+$/.test(t)){ const f = t.split("/"); return parseFloat(f[0])/parseFloat(f[1]); }
  const n = parseFloat(t.replace(",", "."));
  return isFinite(n) ? n : NaN;
}
/* Best-effort split of "250 g plain flour" into qty / unit / name. */
const FRACTIONS = {"½":"1/2","¼":"1/4","¾":"3/4","⅓":"1/3","⅔":"2/3","⅛":"1/8","⅜":"3/8","⅝":"5/8","⅞":"7/8"};
function parseIngredientLine(text){
  const raw = String(text || "").trim()
    .replace(/(\d)?\s*([½¼¾⅓⅔⅛⅜⅝⅞])/g, (m, d, f) => (d ? d + " " : "") + FRACTIONS[f]);
  const m = raw.match(/^([\d]+(?:\s+\d+\/\d+)?(?:[.,]\d+)?(?:\/\d+)?)\s*([a-zA-Z]+)?\.?\s*(.*)$/);
  if(!m) return {qty:1, unit:"each", rawName:raw};
  const qty  = parseFraction(m[1]);
  const word = (m[2] || "").toLowerCase();
  const unit = UNIT_ALIASES[word];
  const name = (unit ? m[3] : ((m[2] ? m[2] + " " : "") + m[3])).trim();
  return {qty: isFinite(qty) ? qty : 1, unit: unit || "each", rawName: name || raw};
}
/* Link written text ("2 large onions, sliced") to something you stock.
   Whole words only, and the stocked name must be the head of the phrase:
   "unsalted butter" finds Butter, but "egg noodles" does not find Eggs and
   "salted caramel" does not find Salt. Anything doubtful stays unlinked,
   where it is flagged, rather than being costed as the wrong thing. */
function wordsOf(s){
  return String(s || "").toLowerCase().replace(/[^a-z0-9\s]/g, " ").split(/\s+/).filter(Boolean).map(w =>
    w.length > 4 && /(ches|shes|sses|xes|oes)$/.test(w) ? w.slice(0, -2) :
    w.length > 3 && w.endsWith("s") && !w.endsWith("ss") ? w.slice(0, -1) : w);
}
function endsWithWords(hay, needle){
  if(!needle.length || needle.length > hay.length) return false;
  const off = hay.length - needle.length;
  return needle.every((w, k) => hay[off + k] === w);
}
function containsWords(hay, needle){
  for(let s = 0; s + needle.length <= hay.length; s++){
    if(needle.every((w, k) => hay[s + k] === w)) return true;
  }
  return false;
}
function matchIngredient(name){
  const phrase = wordsOf(String(name || "").split(/[,(;]/)[0]);
  if(!phrase.length) return null;
  const key = phrase.join(" ");
  const namesOf = i => [i.name].concat(i.aliases || []).filter(Boolean).map(wordsOf);
  const exact = S.ingredients.find(i => namesOf(i).some(w => w.join(" ") === key));
  if(exact) return exact;
  let best = null, bestLen = 0;
  S.ingredients.forEach(i => namesOf(i).forEach(w => {
    if(endsWithWords(phrase, w) && w.length > bestLen){ best = i; bestLen = w.length; }
  }));
  if(best) return best;
  const within = S.ingredients.filter(i => namesOf(i).some(w => containsWords(w, phrase)));
  return within.length === 1 ? within[0] : null;
}
function linesFromStrings(list){
  return (list || []).map(txt => {
    const p = parseIngredientLine(txt);
    const ing = matchIngredient(p.rawName);
    return {ingredientId: ing ? ing.id : null, rawName: p.rawName, qty:p.qty, unit:p.unit, wastePct:0, note:""};
  });
}

function viewToday(){
  const today = feedFor(todayISO());
  const older = recentFeed().filter(f => f.id !== todayISO()).slice(0, 6);
  const acts = frag(
    btn("Write me a recipe", {icon:"spark", cls:"primary", onClick:openWriteRecipe, disabled:!S.sampleReady,

    btn("More ideas now", {icon:"spark", onClick:openIdeaSearch, disabled:!S.sampleReady})
  );

  const head = topbar("Today", new Date().toLocaleDateString(undefined, {weekday:"long", day:"numeric", month:"long"}), acts);
  const out = el("div", null, head);

  if(!S.sampleReady && S.loaded)
    out.append(el("div", {class:"banner"}, el("div", null,
      el("b", null, "AI features are off. "),
      "Add a free Gemini key under Settings to switch on recipe writing, file import and bill scanning. Everything else works as normal.")));

  out.append(searchBox("today-search", S.ui.qToday, "Search ideas and recipes", v => S.ui.qToday = v));
  if(String(S.ui.qToday || "").trim()){
    const q = S.ui.qToday;
    const ideaHits = [];
    recentFeed().forEach(day => (day.items || []).forEach((item, i) => {
      if(hits(q, [item.title, item.cuisine, item.summary, item.site, item.ingredients, item.whyItFits])) ideaHits.push(feedItem(day, i, item));
    }));
    const recipeHits = S.recipes.filter(r => hits(q, [r.name, r.cuisine, r.tags, r.notes, (r.lines || []).map(l => l.rawName)]));
    if(!ideaHits.length && !recipeHits.length){ out.append(noMatch("ideas or recipes")); return out; }
    if(ideaHits.length){ out.append(section("Ideas", el("span", {class:"eyebrow"}, String(ideaHits.length)))); out.append(el("div", {class:"panel"}, ideaHits)); }
    if(recipeHits.length){ out.append(section("Your recipes", el("span", {class:"eyebrow"}, String(recipeHits.length)))); out.append(el("div", {class:"cards"}, recipeHits.map(recipeCard))); }
    return out;
  }

  const alerts = costAlerts();
  if(alerts.length){
    out.append(section("Cost changes this month",
      el("span", {class:"eyebrow"}, (num(S.settings.alertPct) || 10) + "% or more")));

      el("span", null, el("span", {class:"sub2"}, money(a.before) + " → "), el("b", {class:"mono"}, money(a.after)),
        " ", trendPill(a.change))))));
  }

  if(today && today.items && today.items.length){
    out.append(section(niceDate(today.id), el("span", {class:"eyebrow"}, (today.source || "found on the web"))));
    out.append(el("div", {class:"panel"}, today.items.map((item, i) => feedItem(today, i, item))));
  } else {
    out.append(empty("Nothing filed for today",
      "Ask for ideas built on what you already buy, or paste in a recipe you found somewhere.",
      btn("Get ideas now", {cls:"primary", icon:"spark", onClick:openIdeaSearch, disabled:!S.sampleReady})));
  }

  if(older.length){
    out.append(section("Earlier finds"));
    out.append(el("div", {class:"panel"}, older.map(day =>
      el("details", {style:"padding:6px 0;border-bottom:1px solid var(--line)"},
        el("summary", {style:"cursor:pointer;padding:6px 0;font-weight:600"},
          niceDate(day.id) + "  ",
          el("span", {class:"eyebrow"}, (day.items || []).length + " " + pluralise((day.items || []).length, "idea"))),
        (day.items || []).map((item, i) => feedItem(day, i, item))))));
  }

  const recent = S.recipes.slice().sort((a,b) => (b.createdAt || "").localeCompare(a.createdAt || "")).slice(0, 4);

  return out;

    btn("Fewest to buy", {cls:"sm " + (byStock ? "primary" : "ghost"), onClick:() => { S.ui.recipeSort = "stock"; render(); }})));
  if(!byStock){ out.append(el("div", {class:"cards"}, list.map(r => recipeCard(r)))); return out; }
  const scored = list.map(r => ({r:r, sf:recipeShortfall(r)}))
    .sort((a, b) => ((a.sf.unknown > 0) - (b.sf.unknown > 0)) || (a.sf.missing - b.sf.missing) || (a.sf.cost - b.sf.cost));
  out.append(el("div", {class:"cards"}, scored.map(x => {
    const card = recipeCard(x.r);
    card.querySelector(".tags").append(x.sf.missing === 0 && !x.sf.unknown
      ? el("span", {class:"pill good"}, "all in stock")
      : el("span", {class:"pill " + (x.sf.missing ? "warn" : "flat")}, x.sf.missing
          ? "buy " + x.sf.missing + " " + pluralise(x.sf.missing, "item") + (x.sf.cost ? " · " + money(x.sf.cost) : "")
          : "some lines not counted"));
    return card;
  })));
  return out;
}

/* Per-serving cost against the same recipe priced a month ago. */
function monthAgoLine(r, scale, c){
  const then = costRecipe(r, scale, daysAgoISO(TREND_DAYS));
  if(!then.lines.length || then.unpriced || c.unpriced || !(then.perServing > 0)) return null;
  const pct = (c.perServing - then.perServing) / then.perServing * 100;
  if(Math.abs(pct) < 0.5) return null;
  return el("div", {class:"kv"}, el("span", null, "A month ago"),
    el("span", null, el("b", {class:"mono"}, money(then.perServing)), " ", trendPill(pct)));
}

function sourcingSummary(c){
  const needs = {};
  c.lines.forEach(l => {
    if(!l.ing || l.baseQty == null) return;
    needs[l.ing.id] = (needs[l.ing.id] || 0) + l.baseQty;
  });
  const list = Object.keys(needs).map(k => ({ingredientId:k, baseQty:needs[k]}));
  if(!list.length) return el("div", {class:"panel"}, el("h3", null, "Sourcing"),
    el("div", {class:"hint"}, "Link ingredients and add supplier prices to see where to buy."));
  const plan = sourcingPlan(list);
  const bySupplier = {};
  plan.perItem.forEach(i => {
    if(!i.best) return;
    const sid = i.best.price.supplierId;
    bySupplier[sid] = (bySupplier[sid] || 0) + i.cost;
  });
  return el("div", {class:"panel"},
    el("h3", null, "Buy from"),
    Object.keys(bySupplier).sort((a,b) => bySupplier[b] - bySupplier[a]).map(sid =>
      el("div", {class:"kv"},
        el("a", {href:"#/suppliers/" + sid}, (S.ix.sup[sid] && S.ix.sup[sid].name) || "Unknown"),
        el("b", null, money(bySupplier[sid])))),

/* Every quote on file for an ingredient, newest first, each with its change from
   the same supplier's previous quote. Shown once there is some history. */
function priceHistory(i){
  const quotes = [];
  S.prices.filter(p => p.ingredientId === i.id && S.ix.sup[p.supplierId]).forEach(p => {
    [p].concat(p.history || []).forEach(q => {
      const uc = unitCostOf(q, i);
      if(uc.ok) quotes.push({sup:S.ix.sup[p.supplierId], date:q.date || "", q:q, unitCost:uc.value, current:q === p});
    });
  });
  if(!quotes.some(x => !x.current)) return null;
  quotes.sort((a, b) => (a.date > b.date) - (a.date < b.date));
  const last = {};
  quotes.forEach(x => {
    const prev = last[x.sup.id];
    x.change = prev ? (x.unitCost - prev.unitCost) / prev.unitCost * 100 : null;
    last[x.sup.id] = x;
  });
  quotes.reverse();
  return el("div", null, section("Price history"),
    el("div", {class:"wrap"}, el("table", {class:"sheet"},
      el("thead", null, el("tr", null,
        el("th", null, "Quoted"), el("th", null, "Supplier"), el("th", {class:"num"}, "Paid"),
        el("th", {class:"num"}, "Unit price"), el("th", null, "Change"))),
      el("tbody", null, quotes.map(x => el("tr", null,
        el("td", {class:"thin"}, x.date || "—", x.current ? el("div", null, el("span", {class:"pill flat"}, "current")) : null),
        el("td", null, x.sup.name),
        el("td", {class:"num"}, money(x.q.packPrice),
          el("div", {class:"sub2"}, qtyText(num(x.q.packQty)) + " " + unitLabel(x.q.packUnit))),
        el("td", {class:"num"}, perUnitText(x.unitCost, i.baseUnit)),
        el("td", null, x.change == null ? el("span", {class:"sub2"}, "first")
          : (trendPill(x.change) || el("span", {class:"sub2"}, "same")))))))));
}

function prettyBase(qty, baseUnit){
  if(baseUnit === "each") return qtyText(qty) + " each";
  if(baseUnit === "ml") return qty >= 1000 ? qtyText(qty/1000) + " l" : qtyText(qty) + " ml";
  return qty >= 1000 ? qtyText(qty/1000) + " kg" : qtyText(qty) + " g";
}
function shoppingNeeds(){
  const needs = {};
  Object.keys(S.shopping.recipes || {}).forEach(rid => {
    const mult = num(S.shopping.recipes[rid]);
    if(!(mult > 0)) return;
    const r = S.recipes.find(x => x.id === rid);
    if(!r) return;
    const n = recipeNeeds(r, mult).need;
    Object.keys(n).forEach(id => { needs[id] = (needs[id] || 0) + n[id]; });
  });
  (S.shopping.extras || []).forEach(x => {
    const ing = S.ix.ing[x.ingredientId];
    if(!ing) return;
    const conv = convert(x.qty, x.unit, ing.baseUnit, ing);
    if(conv.ok) needs[ing.id] = (needs[ing.id] || 0) + conv.value;
  });
  /* What you already have comes off the list, unless stock is switched off. */
  const useStock = S.shopping.useStock !== false;
  return Object.keys(needs).map(k => {
    const have = useStock ? Math.min(stockOf(k), needs[k]) : 0;
    return {ingredientId:k, need:needs[k], have:have, baseQty:Math.max(0, needs[k] - have)};
  });
}

/* ======================= scan a bill ======================= */
const BILL_PROMPT =
  "You are reading a supplier bill, invoice or till receipt for a cook who records what they pay for ingredients.\n" +
  "List every purchased food or kitchen item. For each item give:\n" +
  "- description: the line as printed\n" +
  "- name: a short plain ingredient name, such as \"Plain flour\", \"Chicken thigh\" or \"Eggs\"\n" +
  "- packQty and packUnit: the size of ONE unit as sold. A 25 kg sack is 25 kg; a tray of 30 eggs is 30 each; " +
  "loose produce sold by weight is the weight bought, such as 2.35 kg\n" +
  "- packPrice: the price of ONE such unit. If a line reads 3 x 4.50 = 13.50, packPrice is 4.50 and packsBought is 3\n" +
  "- packsBought, and sku when a product code is printed\n" +
  "packUnit must be one of: " + UNIT_KEYS.join(", ") + ".\n" +
  "Leave out totals, subtotals, tax, discounts, deposits, bags and delivery charges. " +
  "Never guess a number that is not printed; leave the item out instead.\n" +
  "Also give the supplier name and the bill date as YYYY-MM-DD when printed.\n" +
  'Reply with only JSON: {"supplier":string,"date":string,"items":[{"description":string,"name":string,' +
  '"packQty":number,"packUnit":string,"packPrice":number,"packsBought":number,"sku":string}]}';

const BILL_SCHEMA = {
  type:"object", additionalProperties:false, required:["items"],
  properties:{
    supplier:{type:"string"}, date:{type:"string"},
    items:{type:"array", items:{
      type:"object", additionalProperties:false,
      required:["description","name","packQty","packUnit","packPrice"],
      properties:{
        description:{type:"string"}, name:{type:"string"},
        packQty:{type:"number"}, packUnit:{type:"string", enum:UNIT_KEYS},
        packPrice:{type:"number"}, packsBought:{type:"number"}, sku:{type:"string"}
      }}}
  }
};

function openBillScan(supplierId){
  let supId = supplierId || (S.suppliers[0] && S.suppliers[0].id) || "";
  let file = null, preview = null, text = "", phase = "input", rows = [];
  let billDate = todayISO(), errText = null, ctl = null;
  const byName = (a, b) => (a.name || "").localeCompare(b.name || "");

  const read = async () => {
    if(!file && !text.trim()) return toast("Add a photo or paste the bill first");
    phase = "reading"; errText = null; ctl = new AbortController(); renderModal();
    const prompt = BILL_PROMPT + (text.trim() ? "\n\nBILL TEXT:\n" + text.slice(0, 12000) : "\n\nThe bill is in the attached photo.");
    try {
      const opts = {signal:ctl.signal, schema:BILL_SCHEMA, cache:false};
      if(file && !text.trim()) opts.images = file;
      const out = await sampleFn.json(prompt, opts);
      if(out && /^\d{4}-\d{2}-\d{2}$/.test(out.date || "") && out.date <= todayISO()) billDate = out.date;
      rows = ((out && out.items) || []).filter(x => x && num(x.packQty) > 0 && num(x.packPrice) >= 0).map(x => {
        const hit = matchIngredient(x.name || "") || matchIngredient(x.description || "");
        return {
          description: String(x.description || x.name || "").trim(),
          name: String(x.name || x.description || "").trim(),
          packQty: num(x.packQty), packUnit: UNITS[x.packUnit] ? x.packUnit : "each",
          packPrice: num(x.packPrice), sku: String(x.sku || "").trim(),
          target: hit ? hit.id : "new"
        };
      });
      if(rows.length) phase = "review";
      else { phase = "input"; errText = "No items could be read from that. Try a flatter, brighter photo, or paste the text."; }
    } catch(e){ phase = "input"; if(!e || e.code !== "cancelled") errText = sampleErrorText(e); }
    renderModal();
  };

  const save = async () => {
    if(!S.ix.sup[supId]) return toast("Pick a supplier");
    let created = 0, updated = 0, older = 0, newIng = 0;
    const made = {};
    for(const r of rows){
      if(r.target === "skip" || !(num(r.packQty) > 0) || !(num(r.packPrice) >= 0)) continue;
      let ingId = r.target;
      if(ingId === "new"){
        const key = (r.name || r.description).toLowerCase();
        if(made[key]) ingId = made[key];
        else {
          const fam = UNITS[r.packUnit] ? UNITS[r.packUnit].fam : "mass";
          ingId = await Store.save("ingredients", null, {
            name: r.name || r.description, category:"", aliases:[], tags:[],
            baseUnit: {mass:"g", vol:"ml", count:"each"}[fam]
          });
          made[key] = ingId; newIng++;
        }
      }
      const quote = {packQty:num(r.packQty), packUnit:r.packUnit, packPrice:num(r.packPrice)};
      const existing = S.prices.find(p => p.supplierId === supId && p.ingredientId === ingId) || null;
      /* An older bill than the price on file is history, not the current price. */
      if(existing && existing.date && billDate < existing.date){
        const h = (existing.history || []).concat([Object.assign({date:billDate}, quote)])
          .sort((a, b) => (a.date < b.date) - (a.date > b.date)).slice(0, 24);
        await Store.save("prices", existing.id, Object.assign({}, existing, {history:h}));
        older++; continue;
      }
      const samePack = existing && num(existing.packQty) === quote.packQty && existing.packUnit === quote.packUnit;
      await savePrice(existing, Object.assign({notes:""}, existing || {}, quote, {
        supplierId:supId, ingredientId:ingId, date:billDate,
        packLabel: samePack ? (existing.packLabel || "") : "",
        sku: r.sku || (existing && existing.sku) || ""
      }));
      if(existing) updated++; else created++;
    }
    if(preview) URL.revokeObjectURL(preview);
    closeModal();
    toast(["Saved " + (created + updated) + " " + pluralise(created + updated, "price"),
      newIng ? newIng + " new " + pluralise(newIng, "ingredient") : null,
      older ? older + " older " + pluralise(older, "quote") + " kept as history" : null].filter(Boolean).join(" · "));
  };

  const reviewCard = r => {
    const ing = S.ix.ing[r.target];
    const existing = ing ? S.prices.find(p => p.supplierId === supId && p.ingredientId === ing.id) : null;
    let delta = null;
    if(existing){
      const a = unitCostOf(existing, ing), b = unitCostOf(r, ing);
      if(a.ok && b.ok && a.value > 0) delta = (b.value - a.value) / a.value * 100;
    }
    return el("div", {class:"panel", style:"padding:12px" + (r.target === "skip" ? ";opacity:.55" : "")},
      el("div", {class:"name"}, r.description),
      el("div", {class:"row", style:"margin-top:8px;align-items:flex-end"},
        field("Pack", el("input", {type:"number", step:"any", value:String(r.packQty), style:"width:84px",
          oninput:e => r.packQty = parseFloat(e.target.value)})),
        field("Unit", selectInput(r.packUnit, unitOptions(), v => r.packUnit = v)),
        field("Price", el("input", {type:"number", step:"any", value:String(r.packPrice), style:"width:96px",
          oninput:e => r.packPrice = parseFloat(e.target.value)}))),
      el("div", {style:"margin-top:8px"}, field("Save as", selectInput(r.target,
        [{value:"new", label:"New ingredient: " + (r.name || r.description)}, {value:"skip", label:"Don't save this line"}]
          .concat(S.ingredients.slice().sort(byName).map(i => ({value:i.id, label:i.name}))),
        v => { r.target = v; renderModal(); }))),
      existing ? el("div", {class:"sub2", style:"margin-top:6px"},
        "On file: " + money(existing.packPrice) + " for " + qtyText(num(existing.packQty)) + " " + unitLabel(existing.packUnit) + "  ",
        trendPill(delta)) : null);
  };

  openModal({
    wide:true, title:"Scan a bill", noAutofocus:true,
    body: () => {
      if(phase === "reading") return thinkingBlock("Reading the bill…", () => ctl && ctl.abort());
      if(phase === "review"){
        const keep = rows.filter(r => r.target !== "skip").length;
        return frag(
          el("div", {class:"grid2"},
            field("Bill date", textInput(billDate, v => billDate = v, {type:"date"})),
            el("div", {class:"hint", style:"align-self:end"},
              keep + " of " + rows.length + " lines will be saved to " + ((S.ix.sup[supId] || {}).name || "the supplier") +
              ". Check each pack size and price against the bill.")),
          el("div", {class:"stack", style:"gap:10px"}, rows.map(reviewCard)));
      }
      return frag(
        errText ? el("div", {class:"banner"}, errText) : null,
        field("Supplier", selectInput(supId, S.suppliers.slice().sort(byName).map(s => ({value:s.id, label:s.name})), v => supId = v)),
        S.imagesOk ? field("Photo of the bill",
          el("input", {type:"file", accept:"image/*", capture:"environment", onchange:e => {
            file = (e.target.files && e.target.files[0]) || null;
            if(preview) URL.revokeObjectURL(preview);
            preview = file ? URL.createObjectURL(file) : null;
            renderModal();
          }}),
          file ? "Using " + file.name : "Flat, well lit, the whole bill in the frame.") : null,
        preview ? el("img", {src:preview, alt:"The bill", style:"max-height:220px;max-width:100%;align-self:flex-start;border:1px solid var(--line);border-radius:6px;object-fit:contain"}) : null,
        field(S.imagesOk ? "Or paste the bill's text" : "Paste the bill's text",
          el("textarea", {style:"min-height:110px", placeholder:"Plain flour 25kg   1 x 22.50", oninput:e => text = e.target.value}, text)),
        el("div", {class:"hint"}, "The AI reads each line into a pack size and a price. Nothing is saved until you have checked every row."));
    },
    footer: () => phase === "review"
      ? frag(btn("Back", {cls:"ghost", onClick:() => { phase = "input"; renderModal(); }}),
             btn("Save prices", {cls:"primary", icon:"save", onClick:save}))
      : frag(btn("Cancel", {cls:"ghost", onClick:() => { if(preview) URL.revokeObjectURL(preview); closeModal(); }}),
             btn("Read the bill", {cls:"primary", icon:"spark", disabled:phase === "reading", onClick:read}))
  });
}

  openModal({

/* ======================= asking Claude ======================= */
S.shopping = {recipes:{}, extras:[]};
let sampleFn = null;

/* ---- talking to an AI -------------------------------------------------
   Two providers, picked in Settings: Google Gemini (has a free tier) or
   Anthropic Claude (paid). Each key is kept in this browser only and is
   sent to that provider's API and nowhere else. The rest of the app calls
   the same shim whichever is chosen:
     sampleFn(prompt, opts) -> {text}      sampleFn.json(prompt, opts) -> value
   opts: signal, schema, onText, images (photos), files (photos or PDFs). */
const SDK_URL = "https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.124.0/+esm";
const KEY_STORE = LS + "apikey";
const GEMINI_KEY_STORE = LS + "geminikey";
const GEMINI_MODEL_STORE = LS + "geminimodel";
const PROVIDER_STORE = LS + "aiprovider";
const MODEL = "claude-opus-5";
/* An alias Google moves forward with each release, so the app keeps working
   as model versions change. Settings can override it. */
const GEMINI_DEFAULT_MODEL = "gemini-flash-latest";
const GEMINI_URL = "https://generativelanguage.googleapis.com/v1beta/models/";

const AI = {
  _client:null, _forKey:null, _mem:{},
  /* Where the browser refuses storage, the key lasts until the page closes. */
  get(k){ try { const v = localStorage.getItem(k); if(v != null) return v; } catch(e){} return this._mem[k] || ""; },
  put(k, v){
    v = v ? String(v).trim() : "";
    this._mem[k] = v;
    try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch(e){}
  },
  provider(){
    const p = this.get(PROVIDER_STORE);
    if(p) return p;
    /* Someone who only ever saved a Claude key keeps using Claude. */
    return this.get(KEY_STORE) && !this.get(GEMINI_KEY_STORE) ? "claude" : "gemini";
  },
  label(){ return this.provider() === "claude" ? "Claude" : "Gemini"; },
  claudeKey(){ return this.get(KEY_STORE); },
  geminiKey(){ return this.get(GEMINI_KEY_STORE); },
  geminiModel(){ return this.get(GEMINI_MODEL_STORE) || GEMINI_DEFAULT_MODEL; },
  key(){ return this.provider() === "claude" ? this.claudeKey() : this.geminiKey(); },
  refresh(){ this._client = null; aiTest = null; S.sampleReady = S.imagesOk = !!this.key(); render(); },
  setProvider(p){ this.put(PROVIDER_STORE, p); this.refresh(); },
  /* Pasted keys often carry a space, a line break or quote marks along. */
  clean(v){ return String(v || "").replace(/[\s"'“”‘’]+/g, ""); },
  setKey(v){ this.put(KEY_STORE, this.clean(v)); this.refresh(); },
  setGeminiKey(v){ this.put(GEMINI_KEY_STORE, this.clean(v)); this.refresh(); },
  setGeminiModel(v){ this.put(GEMINI_MODEL_STORE, v); },
  async client(){
    const key = this.claudeKey();
    if(!key) throw {code:"no_key"};
    if(this._client && this._forKey === key) return this._client;
    let Anthropic;
    try { Anthropic = (await import(SDK_URL)).default; }
    catch(e){ throw {code:"sdk_unavailable"}; }
    this._client = new Anthropic({apiKey:key, dangerouslyAllowBrowser:true});
    this._forKey = key;
    return this._client;
  }
};

/* Map whatever the Anthropic SDK throws onto the codes this app handles. */
function toAppError(e, partial){
  if(e && e.code && !e.status) return e;
  const name = e && e.constructor ? e.constructor.name : "";
  const status = e && e.status;
  let code = "upstream_error";
  if(e && e.name === "AbortError") code = "cancelled";
  else if(status === 401 || status === 403 || name === "AuthenticationError" || name === "PermissionDeniedError") code = "auth";
  else if(status === 429 || name === "RateLimitError") code = "rate_limited";
  else if(status === 400 || name === "BadRequestError") code = "invalid_request";
  else if(name === "APIConnectionError" || name === "APIConnectionTimeoutError") code = "offline";
  return {code:code, message:(e && e.message) || "", text:partial};
}

function requestBody(prompt, opts){
  const o = opts || {};
  const body = {
    model: MODEL,
    max_tokens: 8000,
    thinking: {type:"adaptive"},
    messages: [{role:"user", content:prompt}],
    betas: ["server-side-fallback-2026-07-01"],
    fallbacks: "default"
  };
  if(o.schema) body.output_config = {format:{type:"json_schema", schema:o.schema}};
  return body;
}
function textOf(message){
  return (message.content || []).filter(b => b.type === "text").map(b => b.text).join("").trim();
}

/* Phone photos run to several megabytes. Shrink to 1600px JPEG before sending:
   plenty for reading a bill or a recipe card, and inside every API's limits. */
async function shrinkImage(file, maxSide){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, fail) => { const i = new Image(); i.onload = () => ok(i); i.onerror = fail; i.src = url; });
    const k = Math.min(1, (maxSide || 1600) / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(ok => c.toBlob(ok, "image/jpeg", 0.85));
  } finally { URL.revokeObjectURL(url); }
}
async function blobToBase64(blob){
  const bytes = new Uint8Array(await blob.arrayBuffer());
  let s = "";
  for(let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}
/* Photos and PDFs to send along with a prompt, ready for either provider. */
async function attachmentsOf(o){
  const list = [].concat(o.images || [], o.files || []).filter(Boolean);
  const out = [];
  for(const f of list){
    const type = f.type || "";
    if(/^image\//.test(type)){
      let small;
      try { small = await shrinkImage(f, 1600); } catch(e){ throw {code:"image_rejected"}; }
      out.push({mime:"image/jpeg", data: await blobToBase64(small)});
    } else if(type === "application/pdf"){
      if(f.size > 18 * 1024 * 1024) throw {code:"too_big"};
      out.push({mime:"application/pdf", data: await blobToBase64(f)});
    } else throw {code:"file_type"};
  }
  return out;
}

async function callClaude(prompt, opts){
  const o = opts || {};
  const client = await AI.client();
  const body = requestBody(prompt, o);
  const atts = await attachmentsOf(o);
  if(atts.length) body.messages = [{role:"user", content: atts.map(a => a.mime === "application/pdf"
    ? {type:"document", source:{type:"base64", media_type:a.mime, data:a.data}}
    : {type:"image", source:{type:"base64", media_type:a.mime, data:a.data}}
  ).concat([{type:"text", text:prompt}])}];
  let partial = "";
  try {
    if(o.onText && client.beta && client.beta.messages && client.beta.messages.stream){
      const stream = client.beta.messages.stream(body, {signal:o.signal});
      for await (const ev of stream){
        if(ev.type === "content_block_delta" && ev.delta && ev.delta.type === "text_delta"){
          partial += ev.delta.text;
          o.onText({text:partial, delta:ev.delta.text});
        }
      }
      const done = await stream.finalMessage();
      if(done.stop_reason === "refusal") throw {code:"refused"};
      return textOf(done) || partial;
    }
    const msg = await client.beta.messages.create(body, {signal:o.signal});
    if(msg.stop_reason === "refusal") throw {code:"refused"};
    const text = textOf(msg);
    if(!text) throw {code:"empty_completion"};
    if(o.onText) o.onText({text:text, delta:text});
    return text;
  } catch(e){
    throw toAppError(e, partial || undefined);
  }
}

/* Gemini's schema dialect: upper-case types, and no additionalProperties. */
function toGeminiSchema(s){
  if(!s || typeof s !== "object") return s;
  const out = {};
  if(s.type) out.type = String(s.type).toUpperCase();
  if(s.enum){ out.enum = s.enum.map(String); out.format = "enum"; }
  if(s.properties){
    out.properties = {};
    for(const k in s.properties) out.properties[k] = toGeminiSchema(s.properties[k]);
  }
  if(s.items) out.items = toGeminiSchema(s.items);
  if(s.required) out.required = s.required.slice();
  return out;
}
function geminiError(status, raw){
  let msg = "";
  try { msg = (JSON.parse(raw).error || {}).message || ""; } catch(e){}
  if(status === 400 && /api key/i.test(msg)) return {code:"auth", message:msg};
  if(status === 401 || status === 403) return {code:"auth", message:msg};
  if(status === 404) return {code:"model", message:msg};
  if(status === 413) return {code:"too_big", message:msg};
  if(status === 429) return {code:"rate_limited", message:msg};
  if(status === 500 || status === 503) return {code:"busy", message:msg};
  if(status === 400) return {code:"invalid_request", message:msg};
  return {code:"upstream_error", message:msg};
}
/* When the chosen model is busy (Google says "high demand") or out of free
   quota, the next one in this list is asked instead. Quotas are per model on
   the free tier, so a lighter model usually still has room. */
const GEMINI_BACKUPS = ["gemini-3.6-flash", "gemini-3.5-flash", "gemini-3.5-flash-lite"];
const wait = (ms, signal) => new Promise((ok, fail) => {
  const t = setTimeout(ok, ms);
  if(signal) signal.addEventListener("abort", () => { clearTimeout(t); fail({name:"AbortError"}); }, {once:true});
});
/* One model, with the two quiet retries: key in the address for keys refused
   as a header, and plain JSON for models that reject the schema. */
async function askGeminiModel(model, body, key, signal){
  const url = GEMINI_URL + encodeURIComponent(model) + ":generateContent";
  const send = (b, viaUrl) => fetch(url + (viaUrl ? "?key=" + encodeURIComponent(key) : ""), {
    method:"POST", signal:signal,
    headers: viaUrl ? {"content-type":"application/json"} : {"content-type":"application/json", "x-goog-api-key":key},
    body:JSON.stringify(b)
  });
  let res = await send(body, false);
  /* Newer "AQ." keys are refused on some routes when sent as a header; Google
     also accepts the key in the address, so try that once before giving up. */
  if(res.status === 401 || res.status === 403){
    const viaUrl = await send(body, true);
    if(viaUrl.ok || (viaUrl.status !== 401 && viaUrl.status !== 403)) res = viaUrl;
  }
  /* If this model rejects the schema, ask again with plain JSON instead. */
  if(res.status === 400 && body.generationConfig.responseSchema){
    const raw = await res.clone().text();
    if(/schema|unknown name|invalid json payload/i.test(raw)){
      const plain = JSON.parse(JSON.stringify(body));
      delete plain.generationConfig.responseSchema;
      res = await send(plain, false);
    }
  }
  return res;
}
async function callGemini(prompt, opts){
  const o = opts || {};
  const key = AI.geminiKey();
  if(!key) throw {code:"no_key"};
  const parts = (await attachmentsOf(o)).map(a => ({inline_data:{mime_type:a.mime, data:a.data}}));
  parts.push({text:prompt});
  const body = {contents:[{role:"user", parts:parts}], generationConfig:{temperature:0.4}};
  if(o.json){
    body.generationConfig.responseMimeType = "application/json";
    if(o.schema) body.generationConfig.responseSchema = toGeminiSchema(o.schema);
  }
  const models = [AI.geminiModel()].concat(GEMINI_BACKUPS.filter(m => m !== AI.geminiModel()));
  let res = null, lastErr = null;
  try {
    for(const model of models){
      /* busy: wait a moment and ask the same model once more, then move on */
      for(let attempt = 0; attempt < 2; attempt++){
        if(attempt || model !== models[0])
          (o.onStatus || toast)(attempt ? "Gemini is busy — trying again…" : "Trying " + model + " instead…");
        res = await askGeminiModel(model, body, key, o.signal);
        if(res.status !== 500 && res.status !== 503) break;
        if(attempt === 0) await wait(2000, o.signal);
      }
      if(res.ok){ AI.lastModel = model; break; }
      lastErr = geminiError(res.status, await res.text().catch(() => ""));
      /* busy, out of quota, or no such model: try the next one; anything else is final */
      if(!/^(busy|rate_limited|model)$/.test(lastErr.code)) throw lastErr;
    }
  } catch(e){
    if(e && e.code) throw e;
    throw {code: e && e.name === "AbortError" ? "cancelled" : "offline"};
  }
  if(!res || !res.ok) throw lastErr || {code:"upstream_error"};
  const data = await res.json();
  if(data.promptFeedback && data.promptFeedback.blockReason) throw {code:"refused"};
  const cand = (data.candidates || [])[0];
  if(!cand) throw {code:"empty_completion"};
  if(/SAFETY|PROHIBITED|BLOCKLIST|RECITATION/.test(cand.finishReason || "")) throw {code:"refused"};
  const text = ((cand.content || {}).parts || [])
    .filter(p => typeof p.text === "string" && !p.thought).map(p => p.text).join("").trim();
  if(!text) throw {code:"empty_completion"};
  if(o.onText) o.onText({text:text, delta:text});
  return text;
}

function callAI(prompt, opts){
  return AI.provider() === "claude" ? callClaude(prompt, opts) : callGemini(prompt, opts);
}

/* Tolerant JSON reader: whole reply, else one fenced block, else the span
   from the first bracket to the last. */
function readJson(text){
  const tries = [];
  tries.push(text);
  const fence = text.match(/```(?:json)?\s*([\s\S]*?)```/);
  if(fence) tries.push(fence[1]);
  const first = text.search(/[[{]/);
  const last = Math.max(text.lastIndexOf("]"), text.lastIndexOf("}"));
  if(first >= 0 && last > first) tries.push(text.slice(first, last+1));
  for(const t of tries){ try { return JSON.parse(t.trim()); } catch(e){} }
  throw {code:"invalid_json", text:text};
}

function makeSampleFn(){
  const fn = async function(prompt, opts){
    const text = await callAI(prompt, opts);
    return {text:text, truncated:false};
  };
  fn.json = async function(prompt, opts){
    const text = await callAI(prompt, Object.assign({}, opts, {json:true}));
    return readJson(text);
  };
  return fn;
}

function sampleErrorText(e){
  const who = AI.label();
  const map = {
    no_key: "Add your " + (AI.provider() === "claude" ? "Anthropic" : "Gemini") + " API key under Settings first.",
    auth: "That " + who + " API key was refused. Check it under Settings.",
    model: "Gemini does not recognise the model name in Settings. Clear that box to use the default.",
    sdk_unavailable: "Could not load the Claude library — you may be offline. Everything else still works.",
    offline: "No connection to " + who + ". The rest of the app works offline.",
    rate_limited: who + " says that is too many requests for now. On the free tier, wait a minute and try again.",
    busy: who + " is very busy right now — every model was tried. Wait a minute or two and try again.",
    refused: who + " would not answer that one. Try rewording it.",
    invalid_json: "The answer came back in the wrong shape. Try again.",
    invalid_request: who + " could not take that request. Try a smaller file or less text.",
    empty_completion: "Nothing came back. Try again, or ask for less.",
    image_rejected: "That photo could not be read. Try a JPEG or PNG taken with the camera.",
    too_big: "That file is too big to send. Try a smaller one, or split it.",
    file_type: "That kind of file cannot be read. Use a PDF, a photo, Word (.docx), Excel (.xlsx) or text.",
    cancelled: "Stopped."
  };
  const base = (e && map[e.code]) || who + " could not answer just now.";
  const said = e && e.message && /^(auth|model|invalid_request|upstream_error)$/.test(e.code) ? String(e.message).slice(0, 200) : "";
  return said ? base + " " + who + " said: “" + said + "”" : base;
}
function tasteLine(){
