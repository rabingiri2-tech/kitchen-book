name: Build Android APK

# Runs on GitHub's machines — nothing to install on your computer.
# Start it by hand from the Actions tab, or let it run when the app changes.
on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "icon-192.png"
      - "icon-512.png"
      - "icon-maskable-512.png"
      - "assets/icon.png"
      - "android-res/**"
      - "capacitor.config.json"
      - "package.json"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

# If you push twice in a row, drop the older build rather than run both.
concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Make sure the Android SDK has what Capacitor needs
        continue-on-error: true
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true
          fi

      # One name for this build, used for the release and stamped into the app
      # so the app can tell when a newer release exists.
      - name: Name this build
        run: |
          echo "TAG=build-$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_ENV"
          echo "WHAT=$(git log -1 --pretty=%s)" >> "$GITHUB_ENV"

      - name: Gather the app files
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png icon-maskable-512.png www/
          sed -i "s/__KB_BUILD__/$TAG/" www/index.html
          grep -q "const APP_BUILD = \"$TAG\"" www/index.html
          ls -l www

      - name: Install Capacitor
        run: npm install

      - name: Create the Android project
        run: npx cap add android

      # The live scanner opens the camera inside the app, which Android only
      # allows when the app declares it. Android asks the user the first time.
      - name: Camera permission for the live scanner
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' "$M"
          grep -q "android.permission.CAMERA" "$M"
          grep -n "uses-permission\|uses-feature" "$M"

      # The launcher icons are drawn ahead of time and kept in android-res/,
      # so the build needs no image tools. Copy them over the template ones.
      - name: Launcher icons
        run: |
          RES=android/app/src/main/res
          cp -r android-res/. "$RES/"
          rm -f "$RES/drawable-v24/ic_launcher_foreground.xml" "$RES/drawable/ic_launcher_background.xml"
          ls -l "$RES"/mipmap-xxxhdpi "$RES"/mipmap-anydpi-v26

      # Android only installs an update over the old app when both are signed
      # with the same key. Each GitHub machine would otherwise invent a new
      # debug key, so make one the first time, keep it in the repo, and sign
      # every build with it.
      - name: Use the same signing key every time
        run: |
          if [ ! -f signing/debug.keystore ]; then
            mkdir -p signing
            keytool -genkeypair -keystore signing/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Kitchen Book, O=Personal, C=US"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add signing/debug.keystore
            git commit -m "Keep one signing key so app updates install over the old app"
            git push
          fi
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile file("$rootDir/../signing/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          }
          GRADLE
          tail -12 android/app/build.gradle

      - name: Copy the app into the Android project
        run: npx cap sync android

      - name: Build the APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the file
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/kitchen-book.apk
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: kitchen-book-apk
          path: out/kitchen-book.apk
          if-no-files-found: error

      # A release gives you a plain download link you can open on the phone.
      - name: Publish it as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the first line of the notes is what the app shows under "What's new"
          printf '%s\n\n%s\n' "$WHAT" "Download kitchen-book.apk on your Android phone and open it to install. It updates the app in place." > notes.txt
          gh release create "$TAG" out/kitchen-book.apk \
            --title "Kitchen Book $TAG" \
            --notes-file notes.txt --latest
