name: Build Android APK

# Runs on GitHub's machines — nothing to install on your computer.
# Start it by hand from the Actions tab, or let it run when the app changes.
on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "icon-192.png"
      - "assets/icon.png"
      - "capacitor.config.json"
      - "package.json"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

# If you push twice in a row, drop the older build rather than run both.
concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Make sure the Android SDK has what Capacitor needs
        continue-on-error: true
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true
          fi

      - name: Gather the app files
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js icon-192.png www/
          ls -l www

      - name: Install Capacitor
        run: npm install

      - name: Create the Android project
        run: npx cap add android

      # Build the launcher icons from assets/icon.png ourselves. Doing this with
      # ImageMagick rather than a generator means a failure here is a build
      # failure, not a silently stock Android icon.
      - name: Launcher icons
        run: |
          set -e
          IM="magick"; command -v magick >/dev/null || IM="convert"
          ICON=assets/icon.png
          RES=android/app/src/main/res
          BG="#6E2E58"
          test -f "$ICON"
          # square, round, and the adaptive-icon pair, at every density
          set -- "mdpi 48 108" "hdpi 72 162" "xhdpi 96 216" "xxhdpi 144 324" "xxxhdpi 192 432"
          for row in "$@"; do
            set -- $row; D=$1; S=$2; A=$3
            DIR="$RES/mipmap-$D"; mkdir -p "$DIR"
            $IM "$ICON" -resize ${S}x${S} "$DIR/ic_launcher.png"
            $IM "$ICON" -resize ${S}x${S} \
              \( -size ${S}x${S} xc:none -fill white -draw "circle $((S/2)),$((S/2)) $((S/2)),0" \) \
              -alpha set -compose DstIn -composite "$DIR/ic_launcher_round.png"
            $IM -size ${A}x${A} "xc:$BG" "$DIR/ic_launcher_background.png"
            # the mark sits inside the adaptive safe zone, on transparency
            INNER=$(( A * 62 / 100 ))
            $IM -size ${A}x${A} xc:none \
              \( "$ICON" -resize ${INNER}x${INNER} \) -gravity center -composite \
              "$DIR/ic_launcher_foreground.png"
          done
          # point the adaptive icon at those files, and drop the template vectors
          mkdir -p "$RES/mipmap-anydpi-v26"
          for N in ic_launcher ic_launcher_round; do
            printf '%s\n' \
              '<?xml version="1.0" encoding="utf-8"?>' \
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">' \
              '    <background android:drawable="@mipmap/ic_launcher_background"/>' \
              '    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>' \
              '</adaptive-icon>' > "$RES/mipmap-anydpi-v26/$N.xml"
          done
          cat "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          rm -f "$RES/drawable-v24/ic_launcher_foreground.xml" "$RES/drawable/ic_launcher_background.xml"
          echo "--- icons written ---"
          find "$RES" -name "ic_launcher*" -size -1k -print
          echo "(any file listed above is suspiciously small)"

      - name: Copy the app into the Android project
        run: npx cap sync android

      - name: Build the APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the file
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/kitchen-book.apk
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: kitchen-book-apk
          path: out/kitchen-book.apk
          if-no-files-found: error

      # A release gives you a plain download link you can open on the phone.
      - name: Publish it as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" out/kitchen-book.apk \
            --title "Kitchen Book $TAG" \
            --notes "Download kitchen-book.apk on your Android phone and open it to install."
